  <script src="assets/clown-model-base64.js"></script>
  <script type="module">
    try {
      const THREE = await import("three");
      const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
      const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
      const { RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js");

      const container = document.getElementById("escena3d");
      container.style.display = "block";
      const w = container.clientWidth || 340;
      const h = container.clientHeight || 340;

      const caraContainer = document.getElementById("caraCanvas");
      caraContainer.style.display = "block";
      const wCara = caraContainer.clientWidth || 340;
      const hCara = caraContainer.clientHeight || 340;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
      camera.position.set(0, 1.1, 5.2);

      const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
      await renderer.init();
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(w, h);
      renderer.setClearColor(0x000000, 0);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir = new THREE.DirectionalLight(0xffffff, 1.4);
      dir.position.set(2, 4, 3);
      scene.add(dir);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
      dir2.position.set(-2, 1, -2);
      scene.add(dir2);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.35).texture;

      const binary = atob(window.CLOWN_GLB_BASE64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const gltf = await new GLTFLoader().parseAsync(bytes.buffer, "");
      const clown = gltf.scene;

      let maxAniso = 8;
      try { maxAniso = renderer.capabilities.getMaxAnisotropy() || 8; } catch (e) {}
      clown.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        o.material.side = THREE.FrontSide;
        const map = o.material.map;
        if (map) {
          map.anisotropy = maxAniso;
          map.generateMipmaps = true;
          map.minFilter = THREE.LinearMipmapLinearFilter;
          map.magFilter = THREE.LinearFilter;
          map.needsUpdate = true;
        }
      });

      const box = new THREE.Box3().setFromObject(clown, true);
      const sphere = new THREE.Sphere();
      box.getBoundingSphere(sphere);
      clown.position.sub(sphere.center);
      clown.updateMatrixWorld(true);

      const jester = new THREE.Group();
      jester.add(clown);
      scene.add(jester);

      /* Caja real del cuerpo entero, ya centrada (antes "box" estaba en
         coordenadas previas a centrar el clown, lo que obligaba a mezclar
         box.max.y con sphere.center.y — con esto queda todo en el mismo
         sistema). */
      const bodyBox = new THREE.Box3().setFromObject(clown, true);
      const totalHeight = bodyBox.max.y - bodyBox.min.y;

      const fitDistance = sphere.radius / Math.sin((camera.fov * Math.PI / 180) / 2);
      const distance = fitDistance * 1.3;
      camera.position.set(0, sphere.radius * 0.15, distance);
      camera.lookAt(0, 0, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableZoom = false;
      controls.target.set(0, 0, 0);

      const mixer = new THREE.AnimationMixer(clown);

      /* Animaciones por nombre — el modelo trae ~45 clips (aplausos,
         baile, boxeo, "auch", etc.). El diálogo puede pedir una puntual
         para un nodo (nodo.animacion en data/bufon-contenido.js); todo lo
         que no sea la animación de base ("happyidle") se reproduce UNA
         vez y al terminar hace crossfade de vuelta a la de base — así
         nunca queda un gesto puntual (un boxeo, un breakdance) trabado en
         loop, y la idle de fondo sí loopea sin cortes. */
      const IDLE_POR_DEFECTO = "happyidle";
      const clipsPorNombre = {};
      gltf.animations.forEach(clip => { clipsPorNombre[clip.name] = clip; });

      let accionActual = null;
      function reproducirAnimacion(nombre) {
        const clip = clipsPorNombre[nombre] || clipsPorNombre[IDLE_POR_DEFECTO];
        if (!clip) return;
        const esIdle = clip.name === IDLE_POR_DEFECTO;
        const accion = mixer.clipAction(clip);
        accion.reset();
        accion.setLoop(esIdle ? THREE.LoopRepeat : THREE.LoopOnce, esIdle ? Infinity : 1);
        accion.clampWhenFinished = !esIdle;
        accion.enabled = true;
        accion.setEffectiveWeight(1);

        if (accionActual && accionActual !== accion) {
          accion.play();
          accionActual.crossFadeTo(accion, 0.4, true);
        } else {
          accion.fadeIn(0.3).play();
        }
        accionActual = accion;

        if (!esIdle) {
          const alTerminar = (e) => {
            if (e.action !== accion) return;
            mixer.removeEventListener("finished", alTerminar);
            reproducirAnimacion(IDLE_POR_DEFECTO);
          };
          mixer.addEventListener("finished", alTerminar);
        }
      }
      window.bufonReproducirAnimacion = reproducirAnimacion;
      if (clipsPorNombre[IDLE_POR_DEFECTO]) reproducirAnimacion(IDLE_POR_DEFECTO);
      else if (gltf.animations.length) reproducirAnimacion(gltf.animations[0].name);

      /* A diferencia de reproducirAnimacion (un solo pase y vuelta a la
         idle), el baile de aburrimiento se repite en loop unos 20s antes
         de volver — un solo pase del clip dura un par de segundos y se
         sentía cortado apenas arrancaba. */
      const DURACION_BAILE_MS = 20000;

      /* Muchos de estos clips no cierran perfecto (el último frame no
         coincide con el primero), así que el loop se nota como un salto.
         Se recorta ~1 frame (a 24fps) del final SOLO en un clon del clip
         —nunca el original, que reproducirAnimacion sigue usando tal cual
         para otros gestos— así el mixer vuelve a time=0 un poco antes de
         llegar a ese frame conflictivo. */
      const RECORTE_LOOP_S = 1 / 24;
      const clipsBaileRecortados = {};
      function obtenerClipBaile(nombre) {
        if (clipsBaileRecortados[nombre]) return clipsBaileRecortados[nombre];
        const original = clipsPorNombre[nombre];
        if (!original) return null;
        const recortado = original.clone();
        recortado.duration = Math.max(0.05, original.duration - RECORTE_LOOP_S);
        clipsBaileRecortados[nombre] = recortado;
        return recortado;
      }

      function reproducirBaile(nombre) {
        const clip = obtenerClipBaile(nombre);
        if (!clip) return;
        const accion = mixer.clipAction(clip);
        accion.reset();
        accion.setLoop(THREE.LoopRepeat, Infinity);
        accion.clampWhenFinished = false;
        accion.enabled = true;
        accion.setEffectiveWeight(1);

        if (accionActual && accionActual !== accion) {
          accion.play();
          accionActual.crossFadeTo(accion, 0.4, true);
        } else {
          accion.fadeIn(0.3).play();
        }
        accionActual = accion;

        setTimeout(() => {
          if (accionActual === accion) reproducirAnimacion(IDLE_POR_DEFECTO);
        }, DURACION_BAILE_MS);
      }

      /* Si nadie interactúa en 15s, se aburre y baila algo del repertorio.
         Solo dispara si está en la idle de base (nunca interrumpe un gesto
         puntual del diálogo), y cada baile reinicia la cuenta para que no
         se repita en cadena mientras el jugador sigue sin tocar nada. */
      const NOMBRES_BAILE = [
        "breakdance", "Breakdance", "Breakdancemedio", "Breakdancerapido",
        "Rumba", "SillyDance", "Sillydance2", "Sillydance2rapido",
        "Twerk", "Twist"
      ].filter(nombre => clipsPorNombre[nombre]);

      // Si el jugador retoma el diálogo mientras el Bufón está en pleno
      // baile de aburrimiento, se corta al toque en vez de esperar los
      // 20s completos — lo llama el script del diálogo en cada avance.
      window.bufonCortarBaile = function () {
        if (accionActual && NOMBRES_BAILE.includes(accionActual.getClip().name)) {
          reproducirAnimacion(IDLE_POR_DEFECTO);
        }
      };

      const ESPERA_BAILE_MS = 15000;
      let ultimaInteraccion = performance.now();
      function marcarInteraccion() { ultimaInteraccion = performance.now(); }
      document.addEventListener("mousedown", marcarInteraccion);
      document.addEventListener("touchstart", marcarInteraccion);
      document.addEventListener("keydown", marcarInteraccion);

      /* Segunda cámara sobre la MISMA escena, encuadrada en la cabeza —
         en vez de recortar el canvas principal (el canvas de WebGPU no se
         puede releer de forma confiable con drawImage/getImageData en
         todos los navegadores). Como la cabeza está sobre el eje de
         rotación de "jester" (x=0, z=0), el encuadre se mantiene estable
         aunque el cuerpo gire.

         Primer intento (basado en una fracción fija del radio de la
         esfera que envuelve TODO el cuerpo) terminaba mostrando casi el
         cuerpo entero, muy de lejos — la esfera se infla con cualquier
         parte que sobresalga (sombrero, guantes, etc.), así que una
         fracción de ESA esfera no es un buen proxy del tamaño real de la
         cabeza. En cambio: se busca qué mallas del modelo tienen su
         centro en el 22% superior de la altura total y se usa la caja
         real de esas mallas. Si el modelo viene todo fusionado en una
         sola malla (nada queda "arriba"), cae a una estimación
         proporcional más conservadora que la anterior. */
      const headBox = new THREE.Box3();
      let headBoxInit = false;
      const umbralCabeza = bodyBox.max.y - totalHeight * 0.22;
      clown.traverse((o) => {
        if (!o.isMesh) return;
        const mBox = new THREE.Box3().setFromObject(o, true);
        if ((mBox.min.y + mBox.max.y) / 2 <= umbralCabeza) return;
        if (!headBoxInit) { headBox.copy(mBox); headBoxInit = true; }
        else headBox.union(mBox);
      });

      let headCenterY, headHeight, headHalfAncho;
      if (headBoxInit) {
        headCenterY = (headBox.min.y + headBox.max.y) / 2;
        headHeight = headBox.max.y - headBox.min.y;
        headHalfAncho = Math.max(headBox.max.x - headBox.min.x, headBox.max.z - headBox.min.z) / 2;
      } else {
        /* Sin mallas separadas para identificar la cabeza, hay que asumir
           proporciones. La punta de "arriba de todo" suele ser el gorro,
           no la cara — encuadrar ahí mostraba el interior del gorro desde
           adentro, no una cara (primer intento). La cara está más abajo. */
        headHeight = totalHeight * 0.14;
        headCenterY = bodyBox.max.y - totalHeight * 0.26;
        headHalfAncho = headHeight * 0.6;
      }

      const semiencuadre = Math.max(headHeight * 0.55, headHalfAncho) * 2.6;
      const camaraCara = new THREE.PerspectiveCamera(32, wCara / hCara, 0.1, 100);
      const distCara = semiencuadre / Math.tan((camaraCara.fov * Math.PI / 180) / 2);
      camaraCara.position.set(0, headCenterY, distCara);
      camaraCara.lookAt(0, headCenterY, 0);
      /* El plano cercano tiene que quedar bien por delante de la cámara
         respecto de la distancia real al sujeto — si no, la cámara recorta
         todo lo que está más cerca que ese plano y sólo se ve lo que
         sobresale más allá (esto fue justamente el bug de la primera
         versión: near=0.1 con distCara≈0.02, así que se recortaba casi
         todo el modelo salvo la punta de la nariz y los guantes). */
      camaraCara.near = Math.max(0.001, distCara * 0.05);
      camaraCara.far = distCara * 20;
      camaraCara.updateProjectionMatrix();
      /* Colgarla de "jester" (no de la escena) para que herede su
         rotación en cada cuadro: así queda fija respecto de la cara —
         siempre mirándola desde el mismo ángulo — en vez de dar vueltas
         alrededor mientras el cuerpo gira en el panel izquierdo. */
      jester.add(camaraCara);

      const rendererCara = new THREE.WebGPURenderer({ canvas: caraContainer, antialias: true, alpha: true });
      await rendererCara.init();
      rendererCara.setPixelRatio(window.devicePixelRatio || 1);
      rendererCara.setSize(wCara, hCara, false);
      rendererCara.setClearColor(0x000000, 0);

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        mixer.update(delta);

        if (
          NOMBRES_BAILE.length &&
          accionActual && accionActual.getClip().name === IDLE_POR_DEFECTO &&
          performance.now() - ultimaInteraccion >= ESPERA_BAILE_MS
        ) {
          ultimaInteraccion = performance.now();
          reproducirBaile(NOMBRES_BAILE[Math.floor(Math.random() * NOMBRES_BAILE.length)]);
        }

        controls.update();
        renderer.render(scene, camera);
        rendererCara.render(scene, camaraCara);
      });
    } catch (err) {
      const c = document.getElementById("escena3d");
      if (c) c.style.display = "none";
      document.querySelector(".escena").style.display = "block";
      document.querySelector(".escena-cara").style.display = "block";
      console.warn("Escena 3D no disponible, usando figura CSS de respaldo.", err);
    }
  </script>
</body>
</html>
