  <script>
    // Saludo al azar en la puerta, sin nombrar el idioma debajo.
    (function () {
      const puertaTexto = document.querySelector(".puerta-texto");
      const pool = window.SALUDOS_BIENVENIDA || [];
      if (puertaTexto && pool.length) {
        puertaTexto.textContent = pool[Math.floor(Math.random() * pool.length)].texto;
      }
    })();
  </script>
  <script>
  /* =======================================================================
     MOTOR DE DIÁLOGO — recorre el árbol de nodos/elecciones que vive en
     data/bufon-contenido.js. El historial de elecciones del jugador se
     guarda en localStorage (por navegador) y sirve para que el propio
     árbol pueda ramificar según lo que ya se contestó antes
     (hasPreviousChoice / requiresChoice), sin depender de leer Supabase
     desde el cliente.
  ======================================================================= */

  /* Placeholder — el <script type="module"> de más abajo (donde vive el
     mixer de Three.js) la reemplaza por la real apenas el modelo 3D
     termina de cargar. Si la escena 3D falla y se usa el respaldo CSS,
     se queda así de no-op sin romper nada. */
  window.bufonReproducirAnimacion = function () {};

  function historialElecciones() {
    try { return JSON.parse(localStorage.getItem("bufonHistorial") || "[]"); }
    catch (e) { return []; }
  }

  /* Versión de las reglas de puntaje (BUFON_VOCES, umbrales, medidores)
     vigente cuando se registra esta elección. No cambia nada todavía —
     es la marca que hace falta ANTES de que algún día se necesite: si
     BUFON_VOCES cambia de forma incompatible más adelante, esta marca es
     lo que permite decidir a propósito si el pasado se reinterpreta con
     las reglas nuevas o se deja tal cual quedó jugado. Subir este número
     cuando se haga un cambio de ese tipo, no antes. */
  const VOICE_RULESET_VERSION = 1;

  function registrarEnHistorial(eleccionId, opcionId) {
    const historial = historialElecciones();
    // eventId identifica ESTE evento puntual, no la pareja
    // eleccionId+opcionId (que sí puede repetirse legítimamente en temas
    // evolutivos). Es lo que permite fusionar el historial de dos
    // dispositivos sin arriesgarse a contar la misma elección dos veces
    // (ver hidratarHistorialDesdeAuth más abajo) — se manda también a
    // Supabase como event_id (ver bufonRegistrar en js/bufon-supabase.js).
    const eventId = crypto.randomUUID();
    historial.push({ eleccionId, opcionId, ts: Date.now(), eventId, ruleset: VOICE_RULESET_VERSION });
    localStorage.setItem("bufonHistorial", JSON.stringify(historial));
    return eventId;
  }

  /* =====================================================================
     HIDRATACIÓN DESDE CUENTA REAL — bufonHistorial en localStorage sigue
     siendo la única fuente de verdad para lo que se ve en pantalla; esto
     solo lo COMPLETA, nunca lo reemplaza a ciegas.

     Con event_id (ver registrarEnHistorial) ya se puede fusionar de
     verdad en vez de solo "adoptar si está vacío o más corto": cada fila
     remota con event_id que el local todavía no tenga se agrega, sin
     arriesgarse a duplicar nada aunque local y remoto tengan la misma
     cantidad de entradas pero sean DISTINTAS (dos dispositivos jugando
     encuentros distintos, por ejemplo). Solo cuando el local está
     completamente vacío se adopta el remoto entero tal cual, con o sin
     event_id — ahí no hay nada local con qué chocar.

     Filas remotas de ANTES de que existiera event_id (event_id null) no
     se pueden fusionar con certeza si ya hay algo local: se ignoran en
     ese caso, a propósito, antes que arriesgarse a un duplicado.

     Solo aplica si bufonEsIdentidadReal() da true (ver chequearFichasAuth
     en js/bufon-supabase.js) — para el UUID anónimo de siempre esto
     nunca corre, porque leer su propio historial de bufon_elecciones
     requiere estar autenticado de verdad (ver la política de RLS en
     scratchpad/bufon_auth_historial.sql: sin sesión real, este select no
     devuelve nada, falla en silencio). */
  async function hidratarHistorialDesdeAuth() {
    if (typeof bufonEsIdentidadReal !== "function" || !bufonEsIdentidadReal()) return;
    const id = bufonPlayerId();
    try {
      const supabase = await bufonCliente();
      const { data, error } = await supabase
        .from("bufon_elecciones")
        .select("dialogue_id, choice_id, created_at, event_id")
        .eq("player_id", id)
        .order("created_at", { ascending: true });
      if (error || !data || !data.length) return;
      const local = historialElecciones();

      if (local.length === 0) {
        const remoto = data.map(fila => ({
          eleccionId: fila.dialogue_id,
          opcionId: fila.choice_id,
          ts: new Date(fila.created_at).getTime(),
          eventId: fila.event_id || undefined
        }));
        localStorage.setItem("bufonHistorial", JSON.stringify(remoto));
        return;
      }

      const eventIdsLocales = new Set(local.filter(e => e.eventId).map(e => e.eventId));
      const nuevosRemotos = data
        .filter(fila => fila.event_id && !eventIdsLocales.has(fila.event_id))
        .map(fila => ({
          eleccionId: fila.dialogue_id,
          opcionId: fila.choice_id,
          ts: new Date(fila.created_at).getTime(),
          eventId: fila.event_id
        }));
      if (!nuevosRemotos.length) return;
      const fusionado = local.concat(nuevosRemotos).sort((a, b) => a.ts - b.ts);
      localStorage.setItem("bufonHistorial", JSON.stringify(fusionado));
    } catch (err) {
      // Silencioso a propósito, igual que el resto de las llamadas a Supabase.
    }
  }

  /* =====================================================================
     TEMAS COMPLETADOS (permanentes) — un nodo terminal puede declarar
     completeDialogue: "id_del_tema" y, apenas se entra a ese nodo, queda
     registrado para siempre en el mismo historial de localStorage que ya
     guarda las elecciones (eleccionId reservado "__completado__", nunca
     colisiona con un punto de elección real). No es una fuente de verdad
     aparte: se lee con el mismo historialElecciones() de arriba.

     Importante: "seleccionar" una opción del hub y "completar" su tema
     son cosas distintas — hasChoice/usedTopic (arriba) miran si el
     jugador ALGUNA VEZ eligió una opción; esto mira si LLEGÓ al nodo que
     el propio contenido marcó como el final de esa conversación. Se
     puede entrar a una rama, volver antes de terminarla, y seguir
     estando disponible. */
  function haCompletadoDialogo(id) {
    return historialElecciones().some(e => e.eleccionId === "__completado__" && e.opcionId === id);
  }

  function registrarCompletado(id) {
    if (haCompletadoDialogo(id)) return; // ya estaba marcado, no duplicar
    const eventId = registrarEnHistorial("__completado__", id);
    bufonRegistrar({
      dialogueId: "__completado__",
      category: "completado",
      choiceId: id,
      questionText: "completeDialogue",
      choiceText: id,
      eventId
    });
  }

  /* =====================================================================
     TEMAS CONSUMIDOS EN ESTE ENCUENTRO (evolutivos) — para conversaciones
     que no se agotan para siempre (p. ej. "¿Quién es 'Él'?"), sino que
     desaparecen del menú sólo durante la visita actual y pueden volver
     más adelante con contenido nuevo. Usa sessionStorage a propósito:
     sobrevive a un F5 (no queremos que refrescar la página resucite algo
     que el jugador ya preguntó hoy) pero es temporal por pestaña — no
     hace falta todavía un concepto de "encuentro" persistido más allá de
     eso. Un nodo terminal puede declarar consumeEncounter: "id_del_tema"
     igual que completeDialogue. */
  function temasConsumidosEsteEncuentro() {
    try { return JSON.parse(sessionStorage.getItem("bufonTemasConsumidos") || "[]"); }
    catch (e) { return []; }
  }

  function marcarConsumidoEsteEncuentro(id) {
    const temas = temasConsumidosEsteEncuentro();
    if (temas.includes(id)) return;
    temas.push(id);
    sessionStorage.setItem("bufonTemasConsumidos", JSON.stringify(temas));
  }

  /* =====================================================================
     NOMBRE OPCIONAL — no es una cuenta, es una etiqueta atada al mismo
     jester_player_id anónimo de siempre (ver js/bufon-supabase.js). La
     oferta aparece una sola vez en la vida real del navegador (intro_01
     es en sí mismo un evento de "primera visita"), y nunca más si ya
     hay nombre guardado o si ya se mostró la oferta antes. */
  function debeOfrecerRegistro(ctx) {
    return !localStorage.getItem("jesterPlayerName") && !ctx.hasCompletedDialogue("registro_ofrecido");
  }

  /* =====================================================================
     GENERACIÓN 2 — cada Side puede tener su propio mecanismo para
     "avanzar" el contenido del Bufón. El de Side B (5 jugadores
     distintos que agotaron los diálogos, no solo que lo encontraron) es
     una función en Supabase que solo devuelve un booleano (ver
     scratchpad/bufon_generaciones.sql) — la key pública nunca puede leer
     filas de la tabla real. Side A todavía no tiene el suyo definido.

     El chequeo es de red, así que no puede ser parte de
     construirContexto() (que es sincrónico). Se pregunta una sola vez al
     cargar, y en cuanto da true queda cacheado en localStorage para
     siempre — de ahí en más ni se vuelve a preguntar. */
  function generacion2Desbloqueada(lado) {
    return localStorage.getItem("bufonGen2v2_" + lado) === "1";
  }

  async function chequearGeneracion2() {
    const lado = (typeof ladoActual === "function") ? ladoActual() : null;
    if (lado !== "B") return; // Side A: sin mecanismo propio todavía
    if (generacion2Desbloqueada("B")) return;
    try {
      const supabase = await bufonCliente();
      const { data } = await supabase.rpc("bufon_side_b_avanzo");
      if (data === true) localStorage.setItem("bufonGen2v2_B", "1");
    } catch (err) {
      // Silencioso a propósito, igual que el resto de las llamadas a Supabase.
    }
  }
  chequearGeneracion2();

  /* "Aún falta alguien más" — solo tiene sentido preguntarlo si Side B
     todavía no desbloqueó, y el número puede cambiar de una sesión a
     otra (alguien más se puede sumar en cualquier momento), así que a
     diferencia de generacion2Desbloqueada esto NO se cachea para
     siempre: se pregunta una vez por carga de página nomás, en una
     variable de memoria. null mientras no se sabe o no aplica.
     Requiere scratchpad/bufon_falta_uno.sql. */
  let sideBFaltanCache = null;
  async function chequearSideBFaltanUno() {
    const lado = (typeof ladoActual === "function") ? ladoActual() : null;
    if (lado !== "B") return;
    if (generacion2Desbloqueada("B")) return; // ya desbloqueado, no hace falta avisar nada
    try {
      const supabase = await bufonCliente();
      const { data } = await supabase.rpc("bufon_contar_side_b_completos_nombrados");
      if (data !== null && data !== undefined) sideBFaltanCache = 5 - Number(data);
    } catch (err) {
      // Silencioso a propósito, igual que el resto de las llamadas a Supabase.
    }
  }
  chequearSideBFaltanUno();

  /* "Hace más de un día que nadie viene" — puramente local (localStorage),
     sin Supabase de por medio: se guarda el momento de esta visita y se
     compara contra el de la visita anterior. Se recalcula en cada
     iniciarBufon() (no en construirContexto(), que se llama muchas veces
     por render y no puede ir pisando el timestamp cada vez), y el propio
     hecho de mostrar el comentario dentro de esta misma visita ya alcanza
     para no repetirlo (ver consumeEncounter en el nodo). */
  const ULTIMA_VISITA_KEY = "bufonUltimaVisita";
  const UN_DIA_MS = 24 * 60 * 60 * 1000;
  let diaSinVisitaCache = false;
  function chequearDiaSinVisita() {
    const anterior = localStorage.getItem(ULTIMA_VISITA_KEY);
    if (anterior) diaSinVisitaCache = (Date.now() - Number(anterior)) > UN_DIA_MS;
    localStorage.setItem(ULTIMA_VISITA_KEY, String(Date.now()));
  }

  /* =====================================================================
     VOCES INTERNAS — mismo patrón que sideEvidence: una tabla estática
     (data/bufon-voces.js, BUFON_VOCES) anota qué opcionId ya elegidas
     alimentan qué Voz, y acá se suma desde el mismo historial de
     siempre. Ninguna Voz se persiste como contador aparte.

     El "despertar" (etapa >= 2, ver etapaDeVoz) sí necesita un evento
     de una sola vez — no para el puntaje en sí (que siempre se
     recalcula), sino para poder decidir más adelante "esta es la
     primera vez que se le nombra" vs. "ya se había despertado antes".
     Reutiliza el mismo historial con el eleccionId reservado
     "__voz_despierta__", igual que "__completado__" arriba. */
  function calcularVoces(historial) {
    const tabla = window.BUFON_VOCES || {};
    const voces = {};
    historial.forEach(e => {
      const aportes = tabla[e.opcionId];
      if (!aportes) return;
      for (const voz in aportes) {
        voces[voz] = (voces[voz] || 0) + aportes[voz];
      }
    });
    return voces;
  }

  /* =====================================================================
     MEDIDORES DE MENTIROSOS E IMPOSTORES — no son un sistema aparte de
     las Voces, son otra fuente de puntos para ellas. Igual que
     BUFON_VOCES, se recalculan siempre desde el historial completo, así
     que "empiezan a contar" retroactivamente desde el ciclo uno apenas
     se agrega esta función: no hace falta tocar ningún nodo viejo.

     MENTIROSOS — el jugador dio la respuesta del OTRO side en un
     memoryGroup (BUFON_EVIDENCIA ya sabe qué side es cada choice_id), o
     negó un hecho que sí pasó en su mesa real. Alimenta a El Testigo.

     IMPOSTORES — el jugador afirmó ser alguien que probablemente no es
     ("eledar_afirma_ser_el" es el único caso hoy; el patrón es
     reutilizable para cualquier "afirmo ser X" futuro). Alimenta a La
     Coartada.

     Ninguno de los dos es un juicio real sobre la verdad — no hay forma
     de confirmar nada, y no hace falta: lo que cuenta es la elección en
     sí, no si "de verdad" mintió. */
  const NEGACIONES_CONOCIDAS = {
    dragon_no_se: "dragon_first_wounded",
    gareth_no_se: "gareth_reencounter",
    refuge_no_recuerdo: "refuge_destroyed"
  };
  // "intento_registro_personaje" (ver renderFormularioRegistro): intentar
  // registrarse con el nombre de un personaje establecido cuenta como
  // impostor (afirma una identidad ajena) Y como mentiroso (le miente a
  // Slappy sobre quién es) a la vez — de ahí que el mismo opcionId
  // aparezca en las dos listas.
  const CHOICES_IMPOSTOR = ["eledar_afirma_ser_el", "intento_registro_personaje"];
  const CHOICES_MENTIROSO_DIRECTO = { intento_registro_personaje: 3 };

  function calcularMentirosos(historial, campaña) {
    if (!campaña) return 0;
    const evidencia = window.BUFON_EVIDENCIA || {};
    const hechos = (window.BUFON_HECHOS_CONOCIDOS && window.BUFON_HECHOS_CONOCIDOS[campaña]) || [];
    let puntos = 0;
    historial.forEach(e => {
      const dato = evidencia[e.opcionId];
      if (dato && dato.side && dato.side !== campaña) puntos += dato.weight;
      const hechoNegado = NEGACIONES_CONOCIDAS[e.opcionId];
      if (hechoNegado && hechos.includes(hechoNegado)) puntos += 2;
      const pesoDirecto = CHOICES_MENTIROSO_DIRECTO[e.opcionId];
      if (pesoDirecto) puntos += pesoDirecto;
    });
    return puntos;
  }

  function calcularImpostores(historial) {
    return historial.filter(e => CHOICES_IMPOSTOR.includes(e.opcionId)).length * 3;
  }

  /* =====================================================================
     LOS OTROS CUATRO MEDIDORES — mismo espíritu que arriba: cada uno
     alimenta directo a UNA sola Voz, se recalcula siempre desde el
     historial completo, y no necesita tocar ningún nodo viejo para
     empezar a contar. Deliberadamente livianos en contenido nuevo por
     ahora (un solo aviso de Despertar cada uno, sin graduación ni cruces
     propios) — eso queda para ciclos futuros.

     INSISTENCIA (La Grieta) — volver a preguntar algo evolutivo que ya
     se contestó antes, en vez de dejarlo. Hoy el único tema realmente
     evolutivo y repetible es "¿Quién es 'Él'?".

     RESERVA (La Muralla) — elegir la opción que pone un límite o se
     niega a explicarse, en vez de abrirse.

     APEGO (La Herida) — elegir la opción que muestra confianza o
     conexión genuina.

     IDENTIDAD (El Rostro) — cuántas veces la conversación termina
     siendo sobre "quién es quién de verdad".

     CURIOSIDAD (El Hilo) — no profundidad, amplitud: cuántos puntos de
     elección DISTINTOS tocó el jugador en total, no cuántas veces eligió
     en general.

     DESEO (El Apetito) — volumen puro de conversación (historial.length
     ya escalado). Es SUMA aparte del cruce Mentirosos×Impostores que ya
     alimentaba a esta Voz — El Apetito ahora tiene dos fuentes, no solo
     el cruce: sigue siendo la mentira lo que más le interesa, pero
     también el simple hecho de que alguien vuelva una y otra vez. */
  const CHOICES_RESERVA = ["no", "pet_no_entender", "registro_rechazar", "eledar_niega_ser_el"];
  const CHOICES_APEGO = ["yes", "early_return_saludo", "registro_aceptar"];
  const CHOICES_IDENTIDAD = ["early_return_cual_real", "hubert_hooey_es_hooey", "ledros_sigue_siendo", "ledros_ya_no_persona", "early_return_yo_mismo"];

  function calcularInsistencia(historial) {
    const veces = historial.filter(e => e.opcionId === "who_is_he").length;
    return Math.max(0, veces - 1) * 3;
  }

  function calcularReserva(historial) {
    return historial.filter(e => CHOICES_RESERVA.includes(e.opcionId)).length * 2;
  }

  function calcularApego(historial) {
    return historial.filter(e => CHOICES_APEGO.includes(e.opcionId)).length * 2;
  }

  function calcularIdentidad(historial) {
    return historial.filter(e => CHOICES_IDENTIDAD.includes(e.opcionId)).length * 2;
  }

  function calcularCuriosidad(historial) {
    return new Set(historial.map(e => e.eleccionId)).size;
  }

  /* Redefinido: antes esto era volumen de conversación
     (historial.length / 3), pero eso mide exposición al Bufón, no
     deseo — alguien reservadísimo puede hablar muchísimo sin expresar
     nunca qué quiere, y alguien que casi no habla puede admitir un
     deseo fuerte en una sola línea. Ahora suma desde BUFON_DESEO (ver
     data/bufon-voces.js), igual patrón que el resto de los medidores.
     El volumen viejo sigue existiendo, ver calcularVolumenConversacion
     más abajo — pero ya no alimenta a El Apetito por defecto. */
  function calcularDeseo(historial) {
    const tabla = window.BUFON_DESEO || {};
    let puntos = 0;
    historial.forEach(e => {
      const aporte = tabla[e.opcionId];
      if (aporte) puntos += aporte;
    });
    return puntos;
  }

  /* Volumen puro de conversación — cuánto habló, sin filtrar por tipo.
     Expuesto en ctx (ver más abajo) para quien quiera usarlo a futuro,
     pero deliberadamente NO alimenta ninguna Voz por defecto (antes sí
     lo hacía, como Deseo — ver el comentario de calcularDeseo). */
  function calcularVolumenConversacion(historial) {
    return historial.length;
  }

  function etapaDeVoz(puntos) {
    const u = window.BUFON_VOCES_UMBRALES || {};
    if (puntos >= (u.presenciaFuerte ?? 15)) return 4;
    if (puntos >= (u.influencia ?? 10)) return 3;
    if (puntos >= (u.despertar ?? 6)) return 2;
    if (puntos >= (u.murmullo ?? 3)) return 1;
    return 0;
  }

  /* Techo narrativo (ver BUFON_VOCES_TECHO en data/bufon-voces.js): el
     puntaje de una Voz puede seguir subiendo sin límite, pero lo que se
     le PERMITE mostrar todavía puede quedar tapado. Sin entrada en la
     tabla = sin techo (4, el máximo posible) — así una Voz nueva que
     todavía no se agregó a la tabla no queda bloqueada por accidente. */
  function techoNarrativoVoz(voz) {
    const v = (window.BUFON_VOCES_TECHO || {})[voz];
    return v === undefined ? 4 : v;
  }

  /* Etapa REAL de una Voz, la que efectivamente se muestra al jugador,
     tapada por su techo narrativo. Casi todo el motor debería usar esta,
     no etapaDeVoz() directo sobre el puntaje. */
  function etapaVisibleDeVoz(puntos, voz) {
    return Math.min(etapaDeVoz(puntos), techoNarrativoVoz(voz));
  }

  function haDespertadoVoz(voz) {
    return historialElecciones().some(e => e.eleccionId === "__voz_despierta__" && e.opcionId === voz);
  }

  /* Se llama después de cada elección registrada (renderEleccion). Sólo
     escribe el evento la primera vez que una Voz cruza el umbral de
     Despertar — llamadas siguientes con el mismo puntaje no hacen nada.
     Usa la etapa VISIBLE (con techo), no la cruda: no tiene sentido
     marcar "ya despertó" una Voz que el jugador todavía no puede oír
     nombrada, aunque el puntaje de fondo ya lo permitiría. */
  function registrarDespertarVoces(voces) {
    Object.keys(voces).forEach(voz => {
      if (etapaVisibleDeVoz(voces[voz], voz) < 2 || haDespertadoVoz(voz)) return;
      const eventId = registrarEnHistorial("__voz_despierta__", voz);
      bufonRegistrar({
        dialogueId: "__voz_despierta__",
        category: "voz_despierta",
        choiceId: voz,
        questionText: "voice_awakened",
        choiceText: voz,
        eventId
      });
    });
  }

  /* ¿El jugador eligió esta opción alguna vez, en cualquier punto de
     elección? */
  function hasPreviousChoice(opcionId) {
    return historialElecciones().some(e => e.opcionId === opcionId);
  }

  /* ¿El jugador eligió específicamente esta opción en este punto de
     elección? */
  function requiresChoice(eleccionId, opcionId) {
    return historialElecciones().some(e => e.eleccionId === eleccionId && e.opcionId === opcionId);
  }

  /* Placeholder para más adelante: hoy solo chequea si la opción
     contradictoria fue elegida, sin saber todavía qué pares de opciones
     se consideran contradictorios entre sí (eso hace falta definirlo
     como dato, no como código, cuando haya más contenido escrito). */
  function contradictsPreviousChoice(opcionIdContradictoria) {
    return hasPreviousChoice(opcionIdContradictoria);
  }

  /* =====================================================================
     CONTEXTO NARRATIVO — se reconstruye en cada paso a partir del
     historial guardado (nunca se persiste como contador aparte, así una
     opción mal pesada en data/bufon-evidencia.js se corrige sola apenas
     se actualiza esa tabla). Lo que expone:

       actualCampaign   "A" | "B" | null — verdad técnica del login
                        (js/lado.js). Es la única barrera de spoilers:
                        jesterBelief puede estar confundido, esto nunca.
       sideEvidence     { A, B } — suma de weight por lado.
       jesterBelief     UNKNOWN | FAMILIAR | LIKELY_A/B | RECOGNIZED_A/B.
       hasChoice(id)            ¿eligió esta opción alguna vez?
       usedTopic(eleccionId)    ¿ya pasó por este punto de elección?
       hasFact(id)              ¿ese hecho ya pasó en la mesa real de
                                 actualCampaign? (data/bufon-evidencia.js,
                                 BUFON_HECHOS_CONOCIDOS)
       hasCompletedDialogue(id) ¿llegó alguna vez a un nodo con
                                 completeDialogue === id? Permanente.
       consumedThisEncounter(id) ¿un nodo con consumeEncounter === id ya
                                 se mostró en esta visita? Se resetea solo
                                 (sessionStorage, no localStorage) — para
                                 temas evolutivos que pueden volver.
       totalChoices             cantidad total de elecciones hechas.
       innerVoices              { nombreVoz: puntos, ... } — ver
                                 data/bufon-voces.js.
       voiceStage(voz)          0 Dormida / 1 Murmullo / 2 Despertar /
                                 3 Influencia / 4 Presencia fuerte.
       hasVoiceAwakened(voz)    ¿ya cruzó Despertar alguna vez? (evento
                                 de una sola vez, no se "des-despierta"
                                 si el puntaje después no vuelve a subir).

     Pensado para que "visible" en una opción, o un "next" dinámico,
     puedan consultar cualquiera de estos campos sin tener que volver a
     tocar el motor. */
  function construirContexto() {
    const historial = historialElecciones();
    const campaña = (typeof ladoActual === "function") ? ladoActual() : null;
    const hechos = (window.BUFON_HECHOS_CONOCIDOS && campaña)
      ? (window.BUFON_HECHOS_CONOCIDOS[campaña] || [])
      : [];
    const evidencia = window.BUFON_EVIDENCIA || {};
    const voces = calcularVoces(historial);

    // Medidores → Voces. Testigo y Coartada son las principales de
    // Mentirosos/Impostores (se les suma directo); Rostro/Hilo co-acumulan
    // con menos peso desde Impostores porque el tema de identidad también
    // les toca a ellas. El Apetito tiene dos fuentes: el CRUCE de ambos
    // (mentir sobre hechos Y sobre identidad a la vez le resulta
    // interesante, no sospechoso) y, por separado, Deseo — el simple
    // volumen de conversación, sin filtrar por tipo.
    const mentirosos = calcularMentirosos(historial, campaña);
    const impostores = calcularImpostores(historial);
    if (mentirosos > 0) voces.testigo = (voces.testigo || 0) + mentirosos;
    if (impostores > 0) {
      voces.coartada = (voces.coartada || 0) + impostores;
      voces.rostro = (voces.rostro || 0) + Math.floor(impostores / 2);
      voces.hilo = (voces.hilo || 0) + Math.floor(impostores / 2);
    }
    if (mentirosos > 0 && impostores > 0) {
      voces.apetito = (voces.apetito || 0) + Math.min(mentirosos, impostores);
    }

    // Los otros cuatro medidores (ver bloque de funciones más arriba):
    // cada uno alimenta directo a una sola Voz.
    const insistencia = calcularInsistencia(historial);
    const reserva = calcularReserva(historial);
    const apego = calcularApego(historial);
    const identidad = calcularIdentidad(historial);
    const curiosidad = calcularCuriosidad(historial);
    const deseo = calcularDeseo(historial);
    const volumenConversacion = calcularVolumenConversacion(historial);
    if (insistencia > 0) voces.grieta = (voces.grieta || 0) + insistencia;
    if (reserva > 0) voces.muralla = (voces.muralla || 0) + reserva;
    if (apego > 0) voces.herida = (voces.herida || 0) + apego;
    if (identidad > 0) voces.rostro = (voces.rostro || 0) + identidad;
    if (curiosidad > 0) voces.hilo = (voces.hilo || 0) + curiosidad;
    if (deseo > 0) voces.apetito = (voces.apetito || 0) + deseo;

    const sideEvidence = { A: 0, B: 0 };
    const gruposPorLado = { A: new Set(), B: new Set() };
    historial.forEach(e => {
      const dato = evidencia[e.opcionId];
      if (!dato) return;
      sideEvidence[dato.side] += dato.weight;
      gruposPorLado[dato.side].add(dato.memoryGroup);
    });

    function calcularCreencia() {
      const diferencia = sideEvidence.A - sideEvidence.B;
      if (diferencia === 0) {
        return (sideEvidence.A > 0) ? "FAMILIAR" : "UNKNOWN";
      }
      const lider = diferencia > 0 ? "A" : "B";
      const magnitud = Math.abs(diferencia);
      const grupos = gruposPorLado[lider].size;
      if (magnitud >= 7 && grupos >= 3) return "RECOGNIZED_" + lider;
      if (magnitud >= 4 && grupos >= 2) return "LIKELY_" + lider;
      return "FAMILIAR";
    }

    return {
      actualCampaign: campaña,
      sideEvidence,
      jesterBelief: calcularCreencia(),
      totalChoices: historial.length,
      hasChoice: opcionId => historial.some(e => e.opcionId === opcionId),
      usedTopic: eleccionId => historial.some(e => e.eleccionId === eleccionId),
      hasFact: factId => hechos.includes(factId),
      hasCompletedDialogue: haCompletadoDialogo,
      consumedThisEncounter: id => temasConsumidosEsteEncuentro().includes(id),
      // Cacheado en localStorage por chequearGeneracion2() — ver esa
      // función. sideAGen2 queda en false hasta que Side A tenga su
      // propio mecanismo; el campo ya existe para no tener que tocar
      // esta forma de nuevo cuando lo definan.
      sideBGen2: generacion2Desbloqueada("B"),
      sideAGen2: generacion2Desbloqueada("A"),
      // Cacheado en memoria por chequearSideBFaltanUno() (ver esa
      // función) — true solo cuando falta exactamente un jugador
      // nombrado de Side B para desbloquear la generación 2.
      sideBFaltaUno: sideBFaltanCache === 1,
      // Cacheado en memoria por chequearDiaSinVisita() (ver esa
      // función) — true solo cuando pasó más de un día desde la visita
      // anterior a esta misma.
      diaSinVisita: diaSinVisitaCache,
      // Voces internas — ver el bloque "VOCES INTERNAS" más arriba.
      // voiceStage: 0 Dormida, 1 Murmullo (sin nombre todavía en
      // pantalla), 2 Despertar, 3 Influencia, 4 Presencia fuerte.
      innerVoices: voces,
      // Etapa VISIBLE, con techo narrativo ya aplicado (ver
      // BUFON_VOCES_TECHO en data/bufon-voces.js) — esta es la que debe
      // usar cualquier "visible"/contenido nuevo. voiceStageReal es la
      // cruda, sin tapar, solo para el panel de debug (Alt+Shift+D):
      // nunca condicionar contenido de jugador con ella.
      voiceStage: voz => etapaVisibleDeVoz(voces[voz] || 0, voz),
      voiceStageReal: voz => etapaDeVoz(voces[voz] || 0),
      hasVoiceAwakened: haDespertadoVoz,
      // Medidores — ver el bloque "MEDIDORES DE MENTIROSOS E IMPOSTORES"
      // más arriba. Mismas etapas que voiceStage (0 Dormida.. 4 Presencia
      // fuerte), reusando etapaDeVoz en vez de inventar otra escala.
      mentirosos,
      mentirososStage: etapaDeVoz(mentirosos),
      impostores,
      impostoresStage: etapaDeVoz(impostores),
      insistencia, insistenciaStage: etapaDeVoz(insistencia),
      reserva, reservaStage: etapaDeVoz(reserva),
      apego, apegoStage: etapaDeVoz(apego),
      identidad, identidadStage: etapaDeVoz(identidad),
      curiosidad, curiosidadStage: etapaDeVoz(curiosidad),
      deseo, deseoStage: etapaDeVoz(deseo),
      // Volumen puro de conversación, sin filtrar por tipo — NO alimenta
      // ninguna Voz por defecto (ver calcularVolumenConversacion). Queda
      // acá por si algún contenido futuro quiere usarlo con una razón
      // narrativa concreta, aprobada aparte.
      volumenConversacion,
      // ¿El nombre que el jugador registró (opcional, ver "NOMBRE OPCIONAL"
      // más arriba) coincide con alguno de la lista, sin distinguir
      // mayúsculas? Pensado para ramas que solo tienen sentido si quien
      // pregunta es, o dice ser, un personaje puntual (p. ej. Hooey).
      playerNameMatches: (...nombres) => {
        const actual = (localStorage.getItem("jesterPlayerName") || "").trim().toLowerCase();
        return !!actual && nombres.some(n => n.toLowerCase() === actual);
      }
    };
  }

  function resolverDestino(next) {
    return typeof next === "function" ? next(construirContexto()) : next;
  }

  /* =====================================================================
     RECUERDOS ESPONTÁNEOS — el Bufón puede "interrumpir" el regreso al
     menú principal con algo que se le ocurre, en vez de esperar a que el
     jugador se lo pregunte (así no se siente un cuestionario). Cada
     entrada acá es candidata; se ofrece la primera que cumpla sus
     condiciones y todavía no se haya usado. Deliberadamente van una por
     vez: después de mostrar una, next apunta a "intro_reason_sin_recuerdo"
     para garantizar al menos una vuelta normal al menú antes de que se
     pueda disparar otro recuerdo. */
  /* "Te reconozco" — chistes internos de mesa atados al nombre que cada
     quien registró (ver "NOMBRE OPCIONAL" más arriba). ctx no expone el
     nombre crudo para nada más que esto, así que se lee directo de
     localStorage acá, no vía ctx.playerNameMatches (pensado para chequear
     UN nombre por vez, no para esta cascada de casos con prefijos y
     listas). Devuelve el id del nodo a mostrar, o null si el nombre
     registrado no coincide con ninguno. */
  function reaccionPorNombreRegistrado() {
    const n = (localStorage.getItem("jesterPlayerName") || "").trim().toLowerCase();
    if (!n) return null;
    if (n === "eledar") return "bufon_reconoce_eledar_solo";
    if (n === "eledar eagerdawn") return "bufon_reconoce_eledar_completo";
    if (n === "edy" || n === "exus") return "bufon_reconoce_edy";
    if (n === "laia" || n.startsWith("laia ")) return "bufon_reconoce_laia";
    if (["camila", "cami", "noyniee", "mero", "meromero", "nuni"].includes(n)) return "bufon_reconoce_cami";
    if (n === "ryn") return "bufon_reconoce_ryn";
    if (["nacha", "naxa", "bodoque"].includes(n)) return "bufon_reconoce_nacha";
    if (n === "cassius" || n === "cassius coldgrave") return "bufon_reconoce_cassius";
    if (["k4k", "the k4k", "k4kyo1n", "k4kyo1n_", "kak"].includes(n)) return "bufon_reconoce_k4k";
    if (["hooey magoo", "hooey", "magoo", "joan", "mahooey"].includes(n)) return "bufon_reconoce_hooey";
    return null;
  }

  /* =====================================================================
     ÁRBITRO DE PRIORIDAD — con cada vez más candidatos a interrumpir el
     hub (avisos de Voz, graduaciones, gags, recuerdos de campaña...), el
     orden en que están escritos en el array dejó de alcanzar como
     "prioridad real": alguien agrega un candidato nuevo en el medio del
     array sin pensar en qué debería ganarle a qué. PRIORIDAD hace ese
     orden explícito, y el array se ordena por ella una sola vez, al
     cargar — de ahí en más da igual en qué posición se escriba un
     candidato nuevo, con tal de que declare su prioridad.

     CRITICO   — graduaciones e Influencia: son el "Slappy mismo lo
                 nota", el nivel más alto de revelación que existe hoy.
     DESPERTAR — la Voz lo empieza a nombrar, primer nivel de revelación.
     GAG       — chistes de mesa (nombre reconocido), no cambian nada
                 mecánico, son solo sabor.
     RECUERDO  — los recuerdos de campaña "clásicos" (memoryGroup),
                 la prioridad más baja: son el contenido de reserva
                 cuando no hay nada más urgente que decir.

     Cooldown: como ahora hay bastantes más candidatos que antes, dos o
     tres interrupciones seguidas sin que el jugador llegue a ver nunca
     el hub normal se sentiría a cuestionario. Si ya se mostraron
     COOLDOWN_MAXIMO interrupciones seguidas, se corta todo menos lo
     CRITICO hasta que el jugador vea el hub una vez sin interrupción
     (lo cual reinicia el contador). */
  const PRIORIDAD = { CRITICO: 0, DESPERTAR: 1, GAG: 2, RECUERDO: 3 };
  const COOLDOWN_MAXIMO = 2;

  /* =====================================================================
     GRADUACIÓN GENÉRICA DE MEDIDORES — antes esto eran tres bloques
     escritos a mano solo para Mentirosos/Impostores (los otros seis se
     dejaron sin graduación "para no sobrecargar el ciclo uno", una razón
     que ya no aplica: el árbitro de prioridad + cooldown de arriba ya
     evita la saturación sin importar cuánto contenido exista). Ahora es
     un solo generador para los 8, más una lista de datos para cruces —
     agregar un cruce nuevo el día de mañana es una fila acá, no volver a
     tocar el motor.

     MEDIDOR_STAGE_GETTERS: nombre de medidor -> cómo leer su etapa desde
     ctx. Necesario porque cada medidor vive en un campo distinto de ctx
     (ctx.mentirososStage, ctx.reservaStage, etc.) — esto es lo único que
     tiene que saber un mapeo explícito, todo lo demás se deriva.

     CRUCES_DEFINIDOS: pares de medidores con sentido narrativo real
     cuando ambos llegan a Influencia a la vez. Hoy solo existe uno
     (Mentirosos×Impostores → despierta a El Apetito). No hace falta que
     cada medidor tenga un cruce — la mayoría de las combinaciones
     posibles no tienen por qué significar nada, así que solo se listan
     acá las que SÍ se escribieron a mano. */
  const MEDIDOR_STAGE_GETTERS = {
    mentirosos: ctx => ctx.mentirososStage,
    impostores: ctx => ctx.impostoresStage,
    insistencia: ctx => ctx.insistenciaStage,
    reserva: ctx => ctx.reservaStage,
    apego: ctx => ctx.apegoStage,
    identidad: ctx => ctx.identidadStage,
    curiosidad: ctx => ctx.curiosidadStage,
    deseo: ctx => ctx.deseoStage
  };

  const CRUCES_DEFINIDOS = [
    { a: "mentirosos", b: "impostores", marcador: "medidores_cruce", nodo: "bufon_graduacion_cruce" }
    // agregar más acá cuando haya sentido narrativo real, mismo shape:
    // { a: "...", b: "...", marcador: "...", nodo: "bufon_graduacion_..." }
  ];

  function medidorYaCubiertoPorCruce(medidor, ctx) {
    return CRUCES_DEFINIDOS.some(c =>
      (c.a === medidor || c.b === medidor) && ctx.hasCompletedDialogue(c.marcador)
    );
  }

  function generarCandidatosGraduacion() {
    const candidatos = [];
    CRUCES_DEFINIDOS.forEach(c => {
      candidatos.push({
        prioridad: PRIORIDAD.CRITICO,
        condicion: ctx => MEDIDOR_STAGE_GETTERS[c.a](ctx) >= 3 && MEDIDOR_STAGE_GETTERS[c.b](ctx) >= 3
          && !ctx.hasCompletedDialogue(c.marcador),
        nodo: c.nodo
      });
    });
    Object.keys(MEDIDOR_STAGE_GETTERS).forEach(medidor => {
      candidatos.push({
        prioridad: PRIORIDAD.CRITICO,
        condicion: ctx => MEDIDOR_STAGE_GETTERS[medidor](ctx) >= 3
          && !medidorYaCubiertoPorCruce(medidor, ctx)
          && !ctx.hasCompletedDialogue("graduacion_" + medidor),
        nodo: "bufon_graduacion_" + medidor
      });
    });
    return candidatos;
  }

  const RECUERDOS_DISPONIBLES = [
    // Más de un día sin que nadie lo visite (ver chequearDiaSinVisita).
    // CRITICO y primero de la lista a propósito: si alguien vuelve
    // después de un rato largo, esto es lo primero que va a decir, antes
    // que cualquier otra cosa. consumeEncounter en vez de
    // completeDialogue porque tiene que poder repetirse cada vez que
    // vuelva a pasar un día entero, no solo la primera vez en la vida.
    {
      prioridad: PRIORIDAD.CRITICO,
      condicion: ctx => ctx.diaSinVisita && !ctx.consumedThisEncounter("dia_sin_visita"),
      nodo: "bufon_dia_sin_visita"
    },

    // "Te reconozco": la primera vez que el hub se muestra después de
    // registrarse con uno de los nombres de reaccionPorNombreRegistrado().
    {
      prioridad: PRIORIDAD.GAG,
      condicion: ctx => !ctx.hasCompletedDialogue("nombre_reconocido") && reaccionPorNombreRegistrado() !== null,
      nodo: () => reaccionPorNombreRegistrado()
    },

    // Easter egg puntual, hardcodeado para un jugador real (Kak/Cassius):
    // carga memoria de una vuelta anterior de esta misma campaña, de
    // antes de que existiera el Bufón. Mismos alias que el chiste de
    // "k4k" (es la misma persona, distintos registros posibles) —
    // independiente de "nombre_reconocido" a propósito, porque ese
    // marcador ya lo usa el chiste de k4k para estos mismos nombres, y
    // las dos cosas tienen que poder disparar cada una por su lado. Sin
    // tabla, sin medidor, sin etapa: un nombre, un completeDialogue
    // propio, se acabó.
    {
      prioridad: PRIORIDAD.GAG,
      condicion: ctx => ctx.playerNameMatches("kak", "k4k", "the k4k", "k4kyo1n", "k4kyo1n_") && !ctx.hasCompletedDialogue("kak_cassius_revelado"),
      nodo: "bufon_kak_cassius_revelacion"
    },

    // "Aún falta alguien más": solo Side B, solo cuando falta exactamente
    // un jugador nombrado para la generación 2 (ver chequearSideBFaltanUno).
    {
      prioridad: PRIORIDAD.GAG,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBFaltaUno && !ctx.hasCompletedDialogue("side_b_falta_uno"),
      nodo: "bufon_side_b_falta_uno"
    },
    // Seguimiento impaciente del anterior: solo después de que ya vio
    // "Aún falta alguien más" y sigue faltando esa misma persona.
    {
      prioridad: PRIORIDAD.GAG,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBFaltaUno && ctx.hasCompletedDialogue("side_b_falta_uno") && !ctx.hasCompletedDialogue("side_b_falta_uno_impaciente"),
      nodo: "bufon_side_b_falta_uno_impaciente"
    },

    /* =====================================================================
       MEDIDORES — dos etapas de revelación, mismo espíritu que "varios
       Eledar": el Bufón (o una Voz) lo trae solo, sin que se lo pidan.

       Despertar (etapa 2): la Voz principal lo empieza a nombrar en voz
       alta, pero todavía como comentario suyo, no del Bufón.
       Influencia (etapa 3): "graduación" — ahí es Slappy mismo el que lo
       nota, ya no solo la Voz. El cruce (ambos medidores en Influencia a
       la vez) tiene prioridad sobre las graduaciones individuales y es
       el único momento en que aparece El Apetito. */
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.mentirososStage >= 2 && !ctx.hasCompletedDialogue("mentirosos_notado"),
      nodo: "bufon_testigo_menciona_mentira"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.impostoresStage >= 2 && !ctx.hasCompletedDialogue("impostores_notado"),
      nodo: "bufon_coartada_menciona_impostor"
    },
    /* Graduación de los 8 medidores, generada en un solo lugar en vez de
       ocho bloques copiados a mano — así agregar un cruce nuevo el día
       de mañana es una línea de datos acá abajo, no reescribir esto.
       Antes solo Mentirosos/Impostores tenían graduación (los otros
       seis se dejaron livianos "para no sobrecargar el ciclo uno") —
       esa razón ya no aplica: el árbitro de prioridad + cooldown ya
       evita la saturación sin importar cuánto contenido exista, así que
       los 8 tienen ahora el mismo tratamiento. */
    ...generarCandidatosGraduacion(),

    /* Los seis medidores nuevos ya tienen su Despertar de siempre. */
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.insistenciaStage >= 2 && !ctx.hasCompletedDialogue("insistencia_notada"),
      nodo: "bufon_grieta_menciona_insistencia"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.reservaStage >= 2 && !ctx.hasCompletedDialogue("reserva_notada"),
      nodo: "bufon_muralla_menciona_reserva"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.apegoStage >= 2 && !ctx.hasCompletedDialogue("apego_notado"),
      nodo: "bufon_herida_menciona_apego"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.identidadStage >= 2 && !ctx.hasCompletedDialogue("identidad_notada"),
      nodo: "bufon_rostro_menciona_identidad"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.curiosidadStage >= 2 && !ctx.hasCompletedDialogue("curiosidad_notada"),
      nodo: "bufon_hilo_menciona_curiosidad"
    },
    {
      prioridad: PRIORIDAD.DESPERTAR,
      condicion: ctx => ctx.deseoStage >= 2 && !ctx.hasCompletedDialogue("deseo_notado"),
      nodo: "bufon_apetito_menciona_deseo"
    },

    { prioridad: PRIORIDAD.RECUERDO, nodo: "bufon_pet_rescue", eleccion: "pet_rescue", hecho: "pet_rescued", minElecciones: 1 },
    { prioridad: PRIORIDAD.RECUERDO, nodo: "bufon_gareth", eleccion: "gareth_relationship", hecho: "gareth_reencounter", minElecciones: 2 },
    { prioridad: PRIORIDAD.RECUERDO, nodo: "bufon_dragon_wound", eleccion: "dragon_first_wound", hecho: "dragon_first_wounded", minElecciones: 3 },
    { prioridad: PRIORIDAD.RECUERDO, nodo: "bufon_post_refuge", eleccion: "post_refuge_decision", hecho: "refuge_destroyed", minElecciones: 4 },

    /* "Lo que queda" — Eledar/Cassius/Torvrena/Ryn/rumores del juicio ya
       no son botones del hub (ver intro_reason en data/bufon-contenido.js):
       Ledros/Comerciante/Hubert/Laia son los temas reales de este ciclo,
       estos cinco son comentarios que a Slappy "se le ocurren" mientras
       tanto, sin que el jugador tenga que pedirlos — igual que los
       recuerdos de memoryGroup de arriba. Mismos nodos, mismo
       completeDialogue de siempre, solo cambió cómo se llega. */
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBGen2 && ctx.hasFact("eledar_ankle_hurt") && !ctx.hasCompletedDialogue("eledar_tobillo"),
      nodo: "bufon_eledar_tobillo"
    },
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBGen2 && ctx.hasFact("cassius_joined") && !ctx.hasCompletedDialogue("cassius_opinion"),
      nodo: "bufon_cassius_opinion"
    },
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBGen2 && ctx.hasFact("torvrena_hired") && !ctx.hasCompletedDialogue("torvrena_opinion"),
      nodo: "bufon_torvrena_opinion"
    },
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBGen2 && ctx.hasFact("chose_mask") && !ctx.hasCompletedDialogue("ryn_no_durmio"),
      nodo: "bufon_ryn_intro"
    },
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.sideBGen2 && ctx.hasFact("trial_rumors_heard") && !ctx.hasCompletedDialogue("juicio_rumor"),
      nodo: "bufon_juicio_rumor"
    },

    /* Charla normal, sin conexión con "Lo que queda" ni con ningún hecho
       puntual — a propósito no depende de sideBGen2, para que pueda
       aparecer bastante antes que el resto del ciclo. */
    {
      prioridad: PRIORIDAD.RECUERDO,
      condicion: ctx => ctx.actualCampaign === "B" && ctx.totalChoices >= 2 && !ctx.hasCompletedDialogue("brurland_lluvia"),
      nodo: "bufon_brurland_lluvia"
    }
  ].sort((a, b) => a.prioridad - b.prioridad); // orden estable: a igual prioridad, gana el que esté escrito primero

  function contadorInterrupcionesSeguidas() {
    const v = sessionStorage.getItem("bufonInterrupcionesSeguidas");
    return v ? parseInt(v, 10) : 0;
  }

  function elegirRecuerdoDisponible() {
    const ctx = construirContexto();
    const enCooldown = contadorInterrupcionesSeguidas() >= COOLDOWN_MAXIMO;
    for (const candidato of RECUERDOS_DISPONIBLES) {
      if (enCooldown && candidato.prioridad > PRIORIDAD.CRITICO) continue;
      let elegido = false;
      if (candidato.condicion) {
        if (!candidato.condicion(ctx)) continue;
        elegido = true;
      } else {
        if (ctx.totalChoices < candidato.minElecciones) continue;
        if (!ctx.hasFact(candidato.hecho)) continue;
        if (ctx.usedTopic(candidato.eleccion)) continue;
        elegido = true;
      }
      if (elegido) {
        sessionStorage.setItem("bufonInterrupcionesSeguidas", String(contadorInterrupcionesSeguidas() + 1));
        return typeof candidato.nodo === "function" ? candidato.nodo(ctx) : candidato.nodo;
      }
    }
    sessionStorage.setItem("bufonInterrupcionesSeguidas", "0"); // llegó al hub normal, se corta la racha
    return null;
  }

  /* =====================================================================
     REGRESO TEMPRANO — se dispara en vez de la despedida cuando el
     jugador ya se despidió alguna vez (goodbye_ever) y vuelve a quedarse
     sin nada disponible. Es un tema evolutivo más, mismo patrón que
     "¿Quién es 'Él'?": completeDialogue por etapa (para saber a cuál
     saltar la próxima vez) + consumeEncounter (para no repetir la misma
     etapa dos veces en una visita). Si no hay etapa siguiente escrita
     todavía, cae en el retorno genérico corto. */
  function elegirEarlyReturn(ctx) {
    if (ctx.consumedThisEncounter("early_return")) return "bufon_retorno_generico";
    if (!ctx.hasCompletedDialogue("early_return_stage_1")) return "early_return_01";
    return "bufon_retorno_generico"; // agregar más "if" acá cuando exista early_return_02
  }

  const ui = document.getElementById("bufonUI");
  const INTRO_VISTA_KEY = "bufonIntroVista";

  /* Click en cualquier parte de la página avanza una línea (no sólo el
     botón "seguir") mientras se está mostrando texto corrido. Se
     desactiva apenas se llega a una elección, para no disparar una
     opción sin querer con un click cualquiera.

     Lo que NO tiene que avanzar es arrastrar el modelo 3D para girarlo
     (OrbitControls) — pero no por estar "dentro" de una zona del modelo
     (esa caja es grande y termina bloqueando clicks que deberían avanzar
     normalmente), sino por haber sido efectivamente un arrastre: se mide
     cuánto se movió el mouse entre que se apretó y se soltó. */
  let ultimoMouseDownPos = null;
  document.addEventListener("mousedown", (e) => {
    ultimoMouseDownPos = { x: e.clientX, y: e.clientY };
  });

  let clickAvanzarHandler = null;
  function desactivarClickAvanzar() {
    if (!clickAvanzarHandler) return;
    document.removeEventListener("click", clickAvanzarHandler);
    clickAvanzarHandler = null;
  }

  /* Una línea puede ser un string normal (el Bufón hablando) o un
     objeto { voz, texto } — una interjección de una Voz interna que el
     Bufón nunca percibe. Antes de Despertar (etapa < 2) se muestra sin
     nombre ni color propio, como un murmullo todavía sin identificar;
     de Despertar en adelante ya lleva su nombre y color fijos. */
  function renderizarLinea(linea) {
    if (linea && typeof linea === "object" && linea.voz) {
      const ctx = construirContexto();
      const etapa = ctx.voiceStage(linea.voz);
      const info = (window.BUFON_VOCES_INFO || {})[linea.voz] || {};
      if (etapa >= 2) {
        return `
          <div class="voz-linea" style="--voz-color:${info.color || 'var(--ink)'}">
            <span class="voz-nombre">${info.nombre || linea.voz}</span>${linea.texto}
          </div>
        `;
      }
      return `<div class="voz-linea">${linea.texto}</div>`;
    }
    return `<p class="bufon-linea">${linea}</p>`;
  }

  function renderLineas(lineas, alTerminar) {
    let paso = 0;
    function mostrarPaso() {
      ui.innerHTML = renderizarLinea(lineas[paso]);
      desactivarClickAvanzar();
      clickAvanzarHandler = (e) => {
        if (ultimoMouseDownPos) {
          const dx = e.clientX - ultimoMouseDownPos.x;
          const dy = e.clientY - ultimoMouseDownPos.y;
          if (Math.sqrt(dx * dx + dy * dy) > 6) return; // fue un arrastre, no un click
        }
        if (window.bufonCortarBaile) window.bufonCortarBaile();
        if (paso === lineas.length - 1) {
          desactivarClickAvanzar();
          alTerminar();
        } else {
          paso++;
          mostrarPaso();
        }
      };
      document.addEventListener("click", clickAvanzarHandler);
    }
    mostrarPaso();
  }

  /* Un "next"/"eleccion" puede apuntar a un nodo (tiene líneas) o
     directamente a un punto de elección (no todas las respuestas
     necesitan líneas propias antes de la próxima pregunta).

     "intro_reason" es además el único punto donde se decide si el Bufón
     interrumpe con un recuerdo espontáneo en vez de mostrar el menú de
     siempre. "intro_reason_sin_recuerdo" salta esa decisión — lo usan los
     nodos de reacción de cada recuerdo para volver al menú sin arriesgarse
     a encadenar un segundo recuerdo inmediatamente después del primero. */
  function renderDestino(id, contextoTexto) {
    if (id === "__formulario_registro__") { renderFormularioRegistro(); return; }
    if (id === "intro_reason") {
      const recuerdo = elegirRecuerdoDisponible();
      if (recuerdo) { renderNodo(recuerdo); return; }
    }
    if (id === "intro_reason_sin_recuerdo") id = "intro_reason";
    if (window.BUFON_DIALOGO.nodos[id]) { renderNodo(id); return; }
    if (window.BUFON_DIALOGO.elecciones[id]) { renderEleccion(id, contextoTexto); return; }
    ui.innerHTML = `<p class="bufon-linea">...</p>`;
  }

  /* Único paso del árbol que no es ni "líneas" ni "elección": un input de
     texto libre. No hay otro lado del sitio para reutilizar (no existe
     ningún sistema de registro de jugadores, se confirmó antes de
     escribir esto), así que es el único componente nuevo de toda esta
     función — deliberadamente mínimo, sin password ni sesión. */
  function renderFormularioRegistro() {
    desactivarClickAvanzar();
    ui.innerHTML = `
      <form id="bufonRegistroForm" class="bufon-registro-form">
        <input type="text" id="bufonRegistroInput" class="bufon-registro-input" placeholder="¿Cómo te llamo?" maxlength="40" autocomplete="off" required>
        <button type="submit" class="bufon-opcion">Guardar</button>
        <button type="button" id="bufonRegistroCancelar" class="bufon-volver">Seguir anónimo</button>
      </form>
    `;
    const form = document.getElementById("bufonRegistroForm");
    const input = document.getElementById("bufonRegistroInput");
    input.focus();
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const nombre = input.value.trim();
      if (!nombre) return;
      // Niega el registro si el nombre es de un personaje establecido de
      // la campaña (ver data/bufon-nombres-personajes.js — a propósito
      // no incluye Eledar/Ryn/Cassius, que ya tienen su propio chiste
      // de "nombre reconocido"). No guarda nada, muestra el remate y
      // vuelve al formulario para que lo intenten con su nombre real.
      // Cuenta como intento de impostor Y de mentiroso — ver
      // CHOICES_IMPOSTOR / CHOICES_MENTIROSO_DIRECTO más arriba.
      const nombreLower = nombre.toLowerCase();
      const remate = (window.BUFON_NOMBRES_PERSONAJES || {})[nombreLower];
      if (remate) {
        const eventId = registrarEnHistorial("intento_registro_personaje:" + nombreLower, "intento_registro_personaje");
        registrarDespertarVoces(calcularVoces(historialElecciones()));
        bufonRegistrar({
          dialogueId: "intento_registro_personaje",
          category: "intento_impostor",
          choiceId: "intento_registro_personaje",
          questionText: "intento de registro con nombre de personaje",
          choiceText: nombre,
          eventId
        });
        renderLineas(remate, () => renderFormularioRegistro());
        return;
      }
      localStorage.setItem("jesterPlayerName", nombre);
      if (typeof bufonRegistrarNombre === "function") bufonRegistrarNombre(nombre);
      renderDestino("bufon_registro_exitoso");
    });
    document.getElementById("bufonRegistroCancelar").addEventListener("click", (e) => {
      e.stopPropagation();
      renderDestino("bufon_registro_rechazado");
    });
  }

  // Junta las líneas visibles de un nodo en un solo texto legible, para
  // guardar el saludo inicial y los conectores en Supabase — hasta ahora
  // solo se registraban elecciones reales y "completado", nunca las
  // líneas puramente narrativas. Una línea puede ser un string plano o
  // un objeto { voz, texto }.
  function textoDeLineas(lineas) {
    return (lineas || [])
      .map(l => (l && typeof l === "object") ? l.texto : l)
      .filter(Boolean)
      .join(" ");
  }

  function renderNodo(nodoId) {
    const nodo = window.BUFON_DIALOGO.nodos[nodoId];
    if (!nodo) { ui.innerHTML = `<p class="bufon-linea">...</p>`; return; }
    // Se marca al ENTRAR al nodo, no al terminar sus líneas: por
    // definición, un nodo con completeDialogue/consumeEncounter ES el
    // punto que el contenido eligió como final de esa rama.
    if (nodo.completeDialogue) registrarCompletado(nodo.completeDialogue);
    if (nodo.consumeEncounter) marcarConsumidoEsteEncuentro(nodo.consumeEncounter);
    if (nodo.animacion) window.bufonReproducirAnimacion(nodo.animacion);
    // Una línea { voz, ... } por debajo de Murmullo (etapa 0, "Dormida")
    // ni siquiera se muestra sin nombre — a esa altura la Voz todavía no
    // hace ruido perceptible. De Murmullo en adelante sí se filtra hacia
    // adentro (renderizarLinea decide, aparte, si ya lleva nombre o no).
    const ctxVoces = construirContexto();
    const lineas = nodo.lineas.filter(l =>
      !(l && typeof l === "object" && l.voz) || ctxVoces.voiceStage(l.voz) >= 1
    );
    renderLineas(lineas, () => {
      const esSaludoInicial = nodoId === window.BUFON_DIALOGO.inicio && !localStorage.getItem(INTRO_VISTA_KEY);
      if (nodoId === window.BUFON_DIALOGO.inicio) {
        localStorage.setItem(INTRO_VISTA_KEY, "1");
      }
      // El saludo (primera vez nomás, ver "guion" del panel de Admin) y
      // los conectores (nodos que solo narran y siguen solos, sin
      // elección) no se guardaban antes — cuentan como "líneas" para
      // poder leer la conversación de corrido sin agujeros.
      if (esSaludoInicial && typeof bufonRegistrar === "function") {
        bufonRegistrar({
          dialogueId: nodoId,
          category: "saludo",
          choiceId: nodoId,
          questionText: textoDeLineas(lineas),
          choiceText: null
        });
      }
      if (nodo.eleccion) {
        const ultimaLinea = lineas[lineas.length - 1];
        renderDestino(nodo.eleccion, (ultimaLinea && ultimaLinea.texto) || ultimaLinea);
      } else if (nodo.next) {
        const destino = resolverDestino(nodo.next);
        if (!esSaludoInicial && typeof bufonRegistrar === "function") {
          bufonRegistrar({
            dialogueId: nodoId,
            category: "conector",
            choiceId: nodoId,
            questionText: textoDeLineas(lineas),
            choiceText: destino
          });
        }
        renderDestino(destino);
      } else {
        ui.innerHTML = `<p class="bufon-linea">...</p>`;
      }
    });
  }

  function renderEleccion(eleccionId, contextoTexto) {
    desactivarClickAvanzar();
    const eleccion = window.BUFON_DIALOGO.elecciones[eleccionId];
    if (!eleccion) { ui.innerHTML = `<p class="bufon-linea">...</p>`; return; }
    const ctx = construirContexto();
    const opcionesVisibles = eleccion.opciones.filter(op => !op.visible || op.visible(ctx));

    // El hub se quedó sin temas — ni permanentes sin completar, ni
    // evolutivos sin consumir esta visita, ni nada que "visible" deje
    // pasar. La PRIMERA vez que esto pasa en la vida del navegador, se
    // despide (bufon_despedida marca completeDialogue: "goodbye_ever").
    // Cualquier vez después de esa, ya se despidió una vez — no lo
    // repite, usa el regreso temprano evolutivo en su lugar.
    if (eleccionId === "intro_reason" && opcionesVisibles.length === 0) {
      const yaSeDespidio = ctx.hasCompletedDialogue("goodbye_ever");
      // Volviste y otra vez no hay nada nuevo — esto es "tocar la puerta y
      // que no pase nada" de verdad (ver Progreso del Bufón en el panel
      // de Admin). La primera despedida no cuenta, es la salida normal.
      if (yaSeDespidio && typeof bufonRegistrarToquePuerta === "function") bufonRegistrarToquePuerta();
      renderNodo(yaSeDespidio ? elegirEarlyReturn(ctx) : "bufon_despedida");
      return;
    }

    // Una opción puede llevar "voz" (nombreVoz) cuando es una opción
    // exclusiva generada por una Voz interna ya en Influencia o más
    // (ver data/bufon-voces.js) — se distingue visualmente pero es un
    // botón normal en todo lo demás.
    ui.innerHTML = `
      <div class="bufon-opciones">
        ${opcionesVisibles.map(op => {
          if (op.voz) {
            const info = (window.BUFON_VOCES_INFO || {})[op.voz] || {};
            return `<button type="button" class="bufon-opcion bufon-opcion-voz" style="--voz-color:${info.color || 'var(--red)'}" data-id="${op.id}"><span class="voz-nombre-opcion">${info.nombre || op.voz}</span>${op.texto}</button>`;
          }
          return `<button type="button" class="bufon-opcion" data-id="${op.id}">${op.texto}</button>`;
        }).join("")}
      </div>
    `;
    ui.querySelectorAll("[data-id]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        // Igual que con la puerta: si este click sigue burbujeando hasta
        // document, puede alcanzar a un listener de "click en cualquier
        // lado avanza la línea" recién enganchado por renderDestino (si
        // el destino es un nodo de líneas) — y esa primera línea de la
        // respuesta se saltearía sola.
        e.stopPropagation();
        if (window.bufonCortarBaile) window.bufonCortarBaile();
        const opcion = opcionesVisibles.find(o => o.id === btn.dataset.id);
        const eventId = registrarEnHistorial(eleccionId, opcion.id);
        registrarDespertarVoces(calcularVoces(historialElecciones()));
        const registro = bufonRegistrar({
          dialogueId: eleccionId,
          category: "dialogo",
          choiceId: opcion.id,
          questionText: contextoTexto || eleccionId,
          choiceText: opcion.texto,
          eventId
        });
        // La mayoría de las opciones resuelven su destino al toque, sin
        // pisar la red (resolverDestino es sincrónico). "asyncNext" es la
        // excepción: para algo como "decir en el momento que sos Eledar"
        // hace falta ir a Supabase a ver cuánta gente más ya lo dijo antes
        // de decidir qué contesta el Bufón, así que ahí sí se espera —
        // primero a que esta elección quede guardada (si no, alguien
        // podría no contarse a sí mismo todavía), después a la respuesta.
        // El "..." mientras tanto no rompe nada: es la única opción del
        // árbol donde el Bufón tarda medio segundo en reaccionar, y le
        // queda bien.
        let destino;
        if (opcion.asyncNext) {
          desactivarClickAvanzar();
          ui.innerHTML = `<p class="bufon-linea">...</p>`;
          await registro;
          destino = await opcion.asyncNext(construirContexto());
        } else {
          destino = resolverDestino(opcion.next);
        }
        renderDestino(destino);
      });
    });
  }

  async function iniciarBufon() {
    chequearDiaSinVisita();
    // La puerta ya se abrió y la música ya arrancó (ver el click handler
    // más abajo) antes de llegar acá, así que esta espera queda cubierta
    // por la propia animación de la puerta — el jugador no la nota.
    if (typeof chequearFichasAuth === "function") await chequearFichasAuth();
    // Antes de hidratar: si hay historial anónimo viejo de este mismo
    // navegador, reclamarlo bajo la cuenta real primero, así la
    // hidratación de abajo ya lo encuentra bajo la identidad correcta.
    if (typeof bufonMigrarAnonimoSiCorresponde === "function") await bufonMigrarAnonimoSiCorresponde();
    await hidratarHistorialDesdeAuth();
    if (localStorage.getItem(INTRO_VISTA_KEY)) {
      renderDestino("intro_reason");
    } else {
      renderDestino(window.BUFON_DIALOGO.inicio);
    }
  }

  // Música de fondo: aleatoria y continua, arranca recién con el click de
  // la puerta (así el gesto del click habilita el audio sin pelearse con
  // las políticas de autoplay del navegador) y no repite la misma pista
  // dos veces seguidas mientras el repertorio dé para elegir otra.
  function iniciarMusicaBufon() {
    const pistas = window.BUFON_MUSICA || [];
    if (!pistas.length) return;
    const audio = new Audio();
    audio.volume = 0.0875;
    let ultima = null;
    function siguiente() {
      let pista = pistas[Math.floor(Math.random() * pistas.length)];
      if (pistas.length > 1) {
        while (pista === ultima) pista = pistas[Math.floor(Math.random() * pistas.length)];
      }
      ultima = pista;
      audio.src = pista;
      audio.play().catch(() => {});
    }
    audio.addEventListener("ended", siguiente);
    siguiente();
  }

  const puerta = document.getElementById("puertaGate");
  // Sin loguearse en algún Side (o ser Admin), la puerta no lleva a
  // ningún lado — a propósito no hay ningún formulario de login acá,
  // rompía la ambientación. Loguearse pasa en cualquier otra página del
  // sitio; localStorage es del mismo origen, así que ya viene resuelto
  // para cuando alguien llega acá con el link.
  const accesoPermitido = (typeof ladoActual === "function" && !!ladoActual())
    || (typeof esAdmin === "function" && esAdmin());

  /* El toque número 100 (exacto, ver bufonRegistrarToquePuerta en
     js/bufon-supabase.js) dispara este chiste. Ojo: esto pasa DENTRO del
     hub, cuando ya se agotaron los temas (ver el bloque de
     bufonRegistrarToquePuerta más abajo en renderEleccion) — la puerta
     física (#puertaGate) ya no existe en el DOM a esa altura, así que
     esto usa el mismo cuadro de diálogo del hub (ui), no la puerta. Un
     screamer cortito de los mismos que ya usa la contraseña equivocada
     (dispararSusto, con duración configurable), una risita, y una línea
     distinta según si ya tiene a Slappy prendido o no. */
  window.bufonCentoToquesPuerta = function () {
    const RISITAS_PUERTA = [
      "assets/audio/risita-bufon.mp3",
      "assets/audio/risita-bufon-2.mp3",
      "assets/audio/risita-bufon-3.mp3",
      "assets/audio/risita-bufon-4.mp3"
    ];
    function reirse() {
      try {
        const audio = new Audio(RISITAS_PUERTA[Math.floor(Math.random() * RISITAS_PUERTA.length)]);
        audio.volume = 0.6;
        audio.play().catch(() => {});
      } catch (e) { /* silencioso si el archivo no existe todavía */ }
    }

    if (typeof dispararSusto === "function") dispararSusto(500);
    const slappyYaActivo = localStorage.getItem("slappyActivo") === "1";

    setTimeout(() => {
      reirse();
      if (slappyYaActivo) {
        ui.innerHTML = `<p class="bufon-linea">No deberías tener eso. Parece que no me hiciste caso. Tendré que cerrar la puerta para siempre.</p>`;
        setTimeout(() => {
          reirse();
          ui.innerHTML = `<p class="bufon-linea">Era una broma. Ya sé quién te dijo que pusieras eso. Comes muchas ansias, parece.</p>`;
        }, 2600);
      } else {
        ui.innerHTML = `<p class="bufon-linea">Era una broma. Si pones "Slappy" en el sector de easter eggs, aparece un secreto para que no me extrañes tanto.</p>`;
      }
    }, 550);
  };

  if (puerta && !accesoPermitido) {
    puerta.classList.add("puerta-inerte");
    const textoPuerta = puerta.querySelector(".puerta-texto");
    if (textoPuerta) textoPuerta.textContent = "no es tu puerta";
    // No cuenta como "toque" (ver renderEleccion): eso es para cuando el
    // Bufón ya no tiene nada nuevo que decir, no para esto.
  } else if (puerta) {
    puerta.addEventListener("click", (e) => {
      // Si no se corta acá, este mismo click sigue burbujeando hasta
      // document DESPUÉS de que iniciarBufon() ya enganchó ahí el
      // listener de "click en cualquier lado avanza la línea" — y como
      // todavía no terminó de propagarse, ese primer click contaría
      // doble: abre la puerta Y de paso también salta la primera línea.
      e.stopPropagation();
      puerta.classList.add("puerta-abierta");
      puerta.addEventListener("transitionend", () => puerta.remove(), { once: true });
      iniciarBufon();
      iniciarMusicaBufon();
    });
  } else {
    iniciarBufon();
  }

  /* Botón de Admin para volver a probar el árbol desde cero: borra el
     historial de elecciones (localStorage), los temas consumidos de este
     encuentro (sessionStorage) y recarga — así vuelve a aparecer la
     puerta y el hub completo, sin tocar el login (Side/Admin siguen
     iniciados). No borra jester_player_id/jester_session_id: no hace
     falta, y en modo Admin bufonRegistrar ya no manda nada a Supabase. */
  /* El botón visible de reset se fue junto con el widget (rompía la
     ambientación). Como Admin, este atajo hace lo mismo: Alt+Shift+B
     ("Bufón"/"borrar") sobre la página borra el progreso local y
     recarga. Uso Alt+Shift en vez de Ctrl+Shift para no pisar atajos
     reservados del navegador (Ctrl+Shift+R es "recargar sin caché" y
     el navegador lo intercepta antes de que la página se entere).
     Nunca hace nada si no estás en modo Admin. */
  document.addEventListener("keydown", (e) => {
    if (!(e.altKey && e.shiftKey && e.key.toLowerCase() === "b")) return;
    if (!(typeof esAdmin === "function" && esAdmin())) return;
    e.preventDefault();
    localStorage.removeItem("bufonHistorial");
    localStorage.removeItem(INTRO_VISTA_KEY);
    localStorage.removeItem("jesterPlayerName");
    sessionStorage.removeItem("bufonTemasConsumidos");
    location.reload();
  });

  /* Alt+Shift+G ("Generación"), solo Admin: pregunta el estado real de
     cada Side sin esperar a que chequearGeneracion2() lo haga por su
     cuenta (esa corre una sola vez al cargar la página, así que si los 5
     de Side B agotaron los diálogos DESPUÉS de que abriste esta pestaña,
     el caché local todavía no se enteró). Si el caché ya dice true, ni
     siquiera vuelve a preguntarle a Supabase — eso es definitivo. */
  document.addEventListener("keydown", async (e) => {
    if (!(e.altKey && e.shiftKey && e.key.toLowerCase() === "g")) return;
    if (!(typeof esAdmin === "function" && esAdmin())) return;
    e.preventDefault();

    let estadoB = generacion2Desbloqueada("B");
    let detalleB = estadoB ? "sí (desde hace rato — ya está cacheado)" : "todavía no";
    if (!estadoB) {
      try {
        const supabase = await bufonCliente();
        const { data, error } = await supabase.rpc("bufon_side_b_avanzo");
        if (error) {
          detalleB = "no se pudo consultar (" + error.message + ") — ¿corriste bufon_generaciones.sql?";
        } else if (data === true) {
          localStorage.setItem("bufonGen2v2_B", "1");
          estadoB = true;
          detalleB = "sí, recién ahora";
        }
      } catch (err) {
        detalleB = "no se pudo consultar (" + err.message + ")";
      }
    }

    alert(
      "Side B — generación 2: " + detalleB + "\n" +
      (estadoB ? "Falta escribir el contenido nuevo y engancharlo a ctx.sideBGen2." : "") +
      "\n\nSide A — generación 2: sin mecanismo definido todavía."
    );
  });

  /* Alt+Shift+D ("Debug"), solo Admin: vuelca en pantalla prácticamente
     todo lo que construirContexto() ya sabe calcular, para no tener que
     ir a buscarlo a mano entre las ~1000 líneas del motor cada vez que
     algo no sale como se esperaba en mesa. No es para jugadores — no
     hay ningún botón visible, solo el atajo. */
  function mostrarPanelDebug() {
    const ctx = construirContexto();
    const historial = historialElecciones();
    const proximoRecuerdo = elegirRecuerdoDisponible();

    const lineas = [];
    const agregar = (etiqueta, valor) => lineas.push(etiqueta + ": " + valor);
    const seccion = titulo => lineas.push("\n--- " + titulo + " ---");

    seccion("Campaña");
    agregar("actualCampaign", ctx.actualCampaign ?? "(ninguna)");
    agregar("jesterBelief", ctx.jesterBelief);
    agregar("sideEvidence", "A=" + ctx.sideEvidence.A + " / B=" + ctx.sideEvidence.B);
    agregar("totalChoices", ctx.totalChoices);
    agregar("sideBGen2", ctx.sideBGen2);
    agregar("sideAGen2", ctx.sideAGen2);
    agregar("próximo recuerdo elegible", proximoRecuerdo || "(ninguno)");

    seccion("Medidores");
    [
      ["Mentirosos", ctx.mentirosos, ctx.mentirososStage],
      ["Impostores", ctx.impostores, ctx.impostoresStage],
      ["Insistencia", ctx.insistencia, ctx.insistenciaStage],
      ["Reserva", ctx.reserva, ctx.reservaStage],
      ["Apego", ctx.apego, ctx.apegoStage],
      ["Identidad", ctx.identidad, ctx.identidadStage],
      ["Curiosidad", ctx.curiosidad, ctx.curiosidadStage],
      ["Deseo", ctx.deseo, ctx.deseoStage]
    ].forEach(([nombre, puntos, etapa]) => agregar(nombre, puntos + " (etapa " + etapa + ")"));
    agregar("Volumen de conversación (no alimenta ninguna Voz)", ctx.volumenConversacion);

    seccion("Voces internas (etapa visible / etapa real sin techo)");
    Object.keys(window.BUFON_VOCES_INFO || {}).forEach(voz => {
      const info = window.BUFON_VOCES_INFO[voz];
      const puntos = ctx.innerVoices[voz] || 0;
      const etapa = ctx.voiceStage(voz);
      const etapaReal = ctx.voiceStageReal(voz);
      const techo = etapaReal > etapa ? " [TAPADA por techo, real sería " + etapaReal + "]" : "";
      agregar(info.nombre, puntos + " puntos, etapa " + etapa + techo + (ctx.hasVoiceAwakened(voz) ? " (ya despertó alguna vez)" : ""));
    });

    seccion("Diálogo");
    const completados = historial.filter(e => e.eleccionId === "__completado__").map(e => e.opcionId);
    agregar("completados", completados.length ? completados.join(", ") : "(ninguno)");
    const consumidos = temasConsumidosEsteEncuentro();
    agregar("consumidos esta visita", consumidos.length ? consumidos.join(", ") : "(ninguno)");
    const hechos = (window.BUFON_HECHOS_CONOCIDOS || {})[ctx.actualCampaign] || [];
    agregar("hechos conocidos (" + (ctx.actualCampaign || "?") + ")", hechos.length ? hechos.join(", ") : "(ninguno)");
    agregar("total de eventos en historial", historial.length);
    agregar("player_id", (typeof bufonPlayerId === "function") ? bufonPlayerId() : "(bufon-supabase.js no cargado)");

    let panel = document.getElementById("bufonPanelDebug");
    if (panel) panel.remove();
    panel = document.createElement("div");
    panel.id = "bufonPanelDebug";
    panel.style.cssText = "position:fixed;top:10px;right:10px;width:380px;max-height:90vh;overflow:auto;"
      + "background:rgba(10,5,5,.97);color:#eee;border:1px solid #7a1f1f;padding:14px;"
      + "font:11px/1.5 'Courier New',monospace;white-space:pre-wrap;z-index:99999;";
    const cerrar = document.createElement("button");
    cerrar.textContent = "cerrar (Alt+Shift+D)";
    cerrar.style.cssText = "display:block;margin-bottom:10px;background:#7a1f1f;color:#fff;border:none;padding:5px 10px;cursor:pointer;font:11px monospace;";
    cerrar.addEventListener("click", () => panel.remove());
    panel.appendChild(cerrar);
    const cuerpo = document.createElement("div");
    cuerpo.textContent = lineas.join("\n");
    panel.appendChild(cuerpo);
    document.body.appendChild(panel);
  }

  document.addEventListener("keydown", (e) => {
    if (!(e.altKey && e.shiftKey && e.key.toLowerCase() === "d")) return;
    if (!(typeof esAdmin === "function" && esAdmin())) return;
    e.preventDefault();
    const existente = document.getElementById("bufonPanelDebug");
    if (existente) { existente.remove(); return; } // toggle: si ya está abierto, Alt+Shift+D de nuevo lo cierra
    mostrarPanelDebug();
  });

  /* Alt+Shift+P ("Prueba"): ver comentario de esModoPrueba() en
     js/lado.js. A propósito no depende de esAdmin() — el sentido es
     justo poder jugar como un anónimo nuevo sin ensuciar el marcador
     real. El indicador fijo en pantalla existe porque hoy mismo se nos
     olvidó una vez que esto estaba prendido (cuentas "Pepito"/"Laia"
     de prueba coladas en producción) — que quede visible todo el
     tiempo que esté activo es la forma de que no vuelva a pasar. */
  function pintarIndicadorModoPrueba() {
    const existente = document.getElementById("bufonIndicadorPrueba");
    if (!(typeof esModoPrueba === "function" && esModoPrueba())) {
      if (existente) existente.remove();
      return;
    }
    if (existente) return;
    const aviso = document.createElement("div");
    aviso.id = "bufonIndicadorPrueba";
    aviso.textContent = "MODO PRUEBA (Alt+Shift+P para apagar)";
    aviso.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;"
      + "background:#7a1f1f;color:#fff;font:12px/1.6 'Courier New',monospace;"
      + "text-align:center;padding:4px 0;letter-spacing:.05em;";
    document.body.appendChild(aviso);
  }
  pintarIndicadorModoPrueba();

  document.addEventListener("keydown", (e) => {
    if (!(e.altKey && e.shiftKey && e.key.toLowerCase() === "p")) return;
    e.preventDefault();
    localStorage.setItem(MODO_PRUEBA_KEY, esModoPrueba() ? "0" : "1");
    pintarIndicadorModoPrueba();
  });
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
