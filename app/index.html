<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taberna, prueba 2D — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="../../assets/cosas/gorro-bufon.png">
  <style>
    :root {
      --fondo: #0e0a08;
      --panel: #1a1310;
      --borde: #5a4326;
      --oro: #d8b04a;
      --texto: #f0e3c8;
      --apagado: #a8967a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: Georgia, "Times New Roman", serif; }
    body { display: flex; flex-direction: column; }
    .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--borde); background: var(--panel); font-size: 14px; }
    .barra a { color: var(--oro); text-decoration: none; }
    .barra a:hover { text-decoration: underline; }
    .barra .titulo { color: var(--apagado); }
    #fps { color: var(--apagado); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
    .escena { position: relative; flex: 1; min-height: 0; }
    #juego { position: absolute; inset: 0; }
    #juego canvas { display: block; image-rendering: pixelated; }
    .superior { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
    .oculto { display: none !important; }
    #aviso { background: var(--panel); border: 1px solid var(--borde); color: var(--oro); padding: 6px 12px; font-size: 14px; }
    #dialogo { max-width: 520px; width: 100%; background: var(--panel); border: 1px solid var(--borde); padding: 10px 14px; }
    #dialogoNombre { color: var(--oro); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
    #dialogoTexto { font-size: 16px; line-height: 1.4; }
    .ayuda { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--apagado); pointer-events: none; padding: 0 16px; }
  </style>
</head>
<body>
  <div class="barra">
    <a href="../../minijuegos.html">← Minijuegos</a>
    <span class="titulo">Taberna · prueba 2D con Phaser</span>
    <span id="fps">— FPS</span>
  </div>
  <div class="escena">
    <div id="juego"></div>
    <p class="ayuda">WASD o flechas para moverte · E para interactuar · clic para ir a un punto</p>
    <div class="superior">
      <div id="aviso" class="oculto" role="status"></div>
      <div id="dialogo" class="oculto" role="status">
        <div id="dialogoNombre"></div>
        <div id="dialogoTexto"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
