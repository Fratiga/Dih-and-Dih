<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minijuegos — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <link rel="stylesheet" href="css/style.css?v=20261182">
  <link rel="stylesheet" href="css/minijuegos.css?v=20261182">
  <link rel="stylesheet" href="css/mj-temas.css?v=20261182">
</head>
<body class="mj-pagina hub-tema">
  <!-- Página aparte a propósito: sin cabecera del sitio, sin mini reproductor ni
       escenas 3D, para no gastar memoria en lo que no se usa. -->
  <div class="mj-barra">
    <a href="index.html" class="mj-volver">← Volver al inicio</a>
  </div>
  <main class="mj-contenido">
    <p class="eyebrow">PASATIEMPOS</p>
    <h1 class="mj-titulo">Minijuegos</h1>
    <div class="mj-grid">
      <a class="mj-tarjeta" href="sacrificio.html">
        <h3>Sacrificar a Hooey</h3>
        <p>Que ninguno toque el piso.</p>
      </a>
      <a class="mj-tarjeta" href="ritmo.html">
        <h3>Zarabanda</h3>
        <p>Golpea al compás de la rocola.</p>
      </a>
      <a class="mj-tarjeta" href="parranda.html">
        <h3>Parranda</h3>
        <p>Cuatro carriles de rock que caen al ritmo de la rocola.</p>
      </a>
      <a class="mj-tarjeta" href="ajedrez.html">
        <h3>Ajedrez</h3>
        <p>Contra cinco rivales con reloj por jugada, o contra otros jugadores.</p>
      </a>
    </div>
  </main>
  <script>
    /* Juegos que todavía se están afinando: solo los ve y abre el admin (mismo permiso
       que js/oculto.js en cada una de sus páginas). Para abrirlos a todos, quita
       oculto.js de su HTML y pásalos arriba como tarjetas normales. */
    (function () {
      if (localStorage.getItem("compendioAdmin") !== "1") return;
      const grid = document.querySelector(".mj-grid");
      [
        ["arqueria.html", "Arquería", "Dispara a los blancos contra un rival o contra otro jugador."],
        ["duelo.html", "Duelo", "Combate en tiempo real: ataca, bloquea y esquiva."],
        ["cartas.html", "Cartas malditas", "Tu colección de cartas y las batallas."],
        ["ostelar.html", "Ostelar", "La arena: combate por turnos en cuadrícula."]
      ].forEach(([href, titulo, texto]) => {
        const a = document.createElement("a");
        a.className = "mj-tarjeta mj-tarjeta-oculta";
        a.href = href;
        a.innerHTML = "<h3></h3><p></p><small>Solo admin por ahora</small>";
        a.querySelector("h3").textContent = titulo;
        a.querySelector("p").textContent = texto;
        grid.appendChild(a);
      });
    })();
  </script>
  <script src="js/mj-musica.js?v=20261182"></script>
  <script>MjMusica.iniciar("assets/cosas/All The Fun At The Fair.mp3", { volumen: 0.35 });</script>
  <script src="js/fichas-supabase.js?v=20261182"></script>
  <script src="js/presencia.js?v=20261182"></script>
  <script src="js/minijuegos-avisos.js?v=20261182"></script>
</body>
</html>
