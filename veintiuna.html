<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Las Veintiuna Velas — Compendio del Mundo</title>
  <meta name="description" content="Blackjack contra la crupier de cera. Cada mano trae una regla especial que cambia lo que te conviene hacer.">
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <script src="js/dialogos.js?v=20270354"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20270354">
  <link rel="stylesheet" href="css/minijuegos.css?v=20270354">
  <link rel="stylesheet" href="css/veintiuna-juego.css?v=20271127">
  <script src="js/mj-volumen.js?v=20270354"></script>
</head>
<body class="mj-pagina vv-tema vj" data-forma="ancha">
  <script src="js/carga.js?v=20270354"></script>
  <a class="vv-saltar" href="#vvDock">Ir a los controles de la mano</a>
  <div class="mj-barra">
    <span class="mj-enlaces">
      <a href="minijuegos.html" class="mj-volver">← Minijuegos</a>
      <a href="index.html" class="mj-volver mj-volver-sec">Inicio</a>
      <a href="hipodromo.html#cartas" class="mj-volver mj-volver-sec">Hipódromo</a>
    </span>
    <div id="globalLadoWidget" class="global-lado-widget">
      <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
      <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
    </div>
  </div>

  <!-- La habitación (pared, retrato, apliques, cortinas) y el polvo que flota: decorado -->
  <div class="vv-fondo" aria-hidden="true" id="vjSala"></div>
  <div class="vj-luz" aria-hidden="true"><i class="vj-luz-a"></i><i class="vj-luz-b"></i><i class="vj-luz-tinte"></i></div>
  <canvas class="vj-particulas" id="vjParticulas" aria-hidden="true"></canvas>

  <div class="vv-escena vj-escenario" id="vvEscena">
    <main class="vv-sala" id="vvSala" data-fase="cargando">
      <header class="vj-rotulo">
        <span class="vv-marca-emblema" id="vvEmblema"></span>
        <div><p class="eyebrow">Casa de juego</p><h1 class="vv-titulo">Las Veintiuna Velas</h1></div>
      </header>

      <!-- Los objetos de la sala son el menú: se pulsan donde están -->
      <nav class="vj-objetos" aria-label="La sala">
        <a class="vj-obj vj-obj-puerta" id="vvBtnAmigos" href="veintiuna-amigos.html"><span class="vj-obj-dib" data-dib="puerta"></span><span class="vj-obj-etq">Con amigos</span></a>
        <button type="button" class="vj-obj vj-obj-tablon" id="vvBtnDesafios" aria-haspopup="dialog"><span class="vj-obj-dib" data-dib="tablon"></span><span class="vj-obj-etq">Desafíos</span><span class="vv-insignia" id="vvInsignia" hidden></span></button>
        <button type="button" class="vj-obj vj-obj-buhonero" id="vvBtnBuhonero" data-buhonero aria-haspopup="dialog" title="Vender o comprar cartas por tokens"><span class="vj-obj-dib" data-dib="buhonero"></span><span class="vj-obj-etq">Buhonero</span></button>
        <button type="button" class="vj-obj vj-obj-libro" id="vvBtnReglas" aria-haspopup="dialog"><span class="vj-obj-dib" data-dib="libro"></span><span class="vj-obj-etq">Reglas</span></button>
        <button type="button" class="vj-obj vj-obj-cuentas" id="vvBtnHistorial" aria-haspopup="dialog"><span class="vj-obj-dib" data-dib="cuentas"></span><span class="vj-obj-etq">Historial</span></button>
        <button type="button" class="vj-obj vj-obj-cajita vv-boton-sonido" id="vvBtnSonido" aria-pressed="true" title="Efectos de sonido de la mesa (el volumen general está en el control de arriba a la derecha)"><span class="vj-obj-dib" data-dib="cajita"></span><span class="vj-obj-etq"><span aria-hidden="true" id="vvSonidoIcono">♪</span> <span id="vvSonidoTexto">Efectos</span></span></button>
      </nav>

      <p class="vv-aviso" id="vvAviso" role="status" hidden></p>

      <section class="vv-mesa" id="vvMesa" aria-label="La mesa" data-estado="espera">
        <div class="vj-cera">
          <figure class="vv-crupier" id="vvCrupier" data-estado="espera">
            <div class="vj-cera-respira"><div class="vv-crupier-retrato" id="vvCrupierArte"></div></div>
            <figcaption><strong>Cera</strong><span>crupier de la casa</span></figcaption>
            <div class="vv-dicho" id="vvDicho" aria-hidden="true"></div>
          </figure>
        </div>

        <div class="vv-fieltro" id="vvFieltro">
          <div class="vv-tapete" id="vvTapete" aria-hidden="true"></div>

          <div class="vv-lado-mano vj-lado-crupier" id="vvLadoCrupier">
            <div class="vv-etiqueta"><span class="vv-etiqueta-nombre">Crupier</span><span class="vv-total" id="vvTotalCrupier" aria-hidden="true"></span><span class="vv-chip-extra" id="vvNotaCrupier" hidden></span><div class="vv-velas" id="vvVelasCrupier" aria-hidden="true"></div></div>
            <div class="vv-mano" id="vvManoCrupier" data-quien="crupier"></div>
          </div>

          <!-- La carta de la regla: de pie en su atril, la gira la crupier al repartir -->
          <aside class="vv-placa" id="vvPlaca" data-regla="fortuna" aria-label="Regla especial de la ronda" hidden>
            <div class="vj-placa-cara">
              <p class="vv-placa-etq" id="vvPlacaEtq">Regla de la próxima mano</p>
              <div class="vv-placa-icono" id="vvPlacaIcono" aria-hidden="true"></div>
              <h2 class="vv-placa-nombre" id="vvPlacaNombre">—</h2>
              <p class="vv-placa-efecto" id="vvPlacaEfecto"></p>
              <span class="vv-placa-estado" id="vvPlacaEstado"></span>
              <button type="button" class="vv-enlace" id="vvPlacaMas" aria-haspopup="dialog">Cómo funciona</button>
            </div>
          </aside>

          <div class="vv-centro" id="vvCentro">
            <div class="vv-resultado" id="vvResultado" role="status" hidden>
              <p class="vv-resultado-etq" id="vvResultadoEtq"></p>
              <h2 class="vv-resultado-titulo" id="vvResultadoTitulo"></h2>
              <p class="vv-resultado-razon" id="vvResultadoRazon"></p>
              <p class="vv-resultado-linea" id="vvResultadoLinea"></p>
            </div>
          </div>

          <div class="vv-lado-mano vj-lado-jugador" id="vvLadoJugador">
            <div class="vv-mano" id="vvManoJugador" data-quien="jugador"></div>
            <div class="vv-etiqueta"><span class="vv-etiqueta-nombre">Tú</span><span class="vv-total" id="vvTotalJugador" aria-hidden="true"></span><span class="vv-chip-extra" id="vvNotaJugador" hidden></span></div>
            <div class="vv-velas vj-velas-jugador" id="vvVelasJugador" aria-hidden="true"></div>
          </div>
          <div class="vv-apuesta" id="vvApuestaMesa" aria-hidden="true"></div>

          <div class="vv-zapato" id="vvZapato" aria-hidden="true"></div>
          <div class="vv-ojo" id="vvOjo" hidden><span class="vv-ojo-etq">Siguiente</span><div class="vv-ojo-carta" id="vvOjoCarta" role="img"></div></div>
        </div>

        <!-- La baranda de cuero: tu bolsa, el fichero, las acciones y la campanilla -->
        <section class="vv-dock" id="vvDock" tabindex="-1" aria-label="Controles de la mano" aria-live="off">
          <div class="vv-saldo vj-bolsa" role="group" aria-label="Tus tokens de juego">
            <span class="vj-bolsa-dib" id="vjBolsa"></span>
            <span class="vv-saldo-datos"><strong id="vvSaldo">—</strong><small>tokens de juego</small></span>
          </div>
          <div class="vv-dock-cuerpo" id="vvDockCuerpo"></div>
          <button type="button" class="vv-enlace vj-atajos" id="vvAtajosBtn">Atajos de teclado</button>
        </section>
      </section>
    </main>
  </div>

  <div id="vvSr" class="vv-sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="vvSrFuerte" class="vv-sr" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div class="vv-toasts" id="vvToasts"></div>

  <dialog class="vv-dialogo vj-dlg-libro" id="vvDlgReglas" aria-labelledby="vvDlgReglasT"></dialog>
  <dialog class="vv-dialogo vj-dlg-tablon" id="vvDlgDesafios" aria-labelledby="vvDlgDesafiosT"></dialog>
  <dialog class="vv-dialogo vj-dlg-cuentas" id="vvDlgHistorial" aria-labelledby="vvDlgHistorialT"></dialog>
  <dialog class="vv-dialogo vj-dlg-buhonero" id="vvDlgBuhonero" aria-labelledby="vvDlgBuhoneroT"></dialog>
  <dialog class="vv-dialogo vv-dialogo-chico vj-dlg-placa" id="vvDlgAtajos" aria-labelledby="vvDlgAtajosT"></dialog>

  <script src="js/temas.js?v=20270354"></script>
  <script src="js/fichas-supabase.js?v=20270354"></script>
  <script src="js/interruptores.js?v=20270354"></script>
  <script src="js/presencia.js?v=20270354"></script>
  <script src="js/lado.js?v=20270354"></script>
  <script src="js/veintiuna-arte.js?v=20270354"></script>
  <script src="js/veintiuna-salon.js?v=20271125"></script>
  <script src="js/veintiuna-vista.js?v=20270354"></script>
  <script src="js/veintiuna-api.js?v=20270354"></script>
  <script src="js/recompensas.js?v=20270354"></script>
  <script src="js/veintiuna-buhonero.js?v=20270354"></script>
  <script src="js/veintiuna-mesa.js?v=20271125"></script>
  <script src="js/minijuegos-avisos.js?v=20270354"></script>
  <script src="js/avisos-admin.js?v=20270354"></script>
  <script src="js/musica-paginas.js?v=20271260"></script>
</body>
</html>
