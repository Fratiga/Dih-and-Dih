<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Estocatta — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <script src="js/oculto.js?v=20271271"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20271271">
  <link rel="stylesheet" href="css/minijuegos.css?v=20271271">
  <link rel="stylesheet" href="css/estocatta.css?v=20271271">
  <script src="js/mj-volumen.js?v=20271271"></script>
</head>
<body class="mj-pagina est-pagina">
  <script src="js/carga.js?v=20271271"></script>
  <!-- Página aparte a propósito: sin cabecera del sitio, sin mini reproductor ni escenas 3D. -->
  <div class="mj-barra est-barra">
    <span class="mj-enlaces">
      <a href="minijuegos.html" class="mj-volver">← Minijuegos</a>
      <a href="index.html" class="mj-volver mj-volver-sec">Inicio</a>
      <button type="button" class="mj-volver mj-volver-sec est-pantalla" id="estPantalla">Pantalla completa</button>
    </span>
    <div id="globalLadoWidget" class="global-lado-widget">
      <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
      <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
    </div>
  </div>

  <main class="est-main">
    <h1 class="est-oculto">Estocatta</h1>
    <div class="est-juego" id="estJuego">
      <div class="est-escenario" id="estEscenario">
        <canvas id="estCampo" class="est-campo" width="480" height="270" aria-label="El claustro de Estocatta"></canvas>

        <div class="est-ui" id="estUi">

          <!-- Portada: el título está dibujado en el lienzo; el menú, debajo a la izquierda -->
          <section class="est-capa est-portada" id="estPortada" aria-label="Menú principal">
            <nav class="est-menu">
              <button type="button" id="estIrLocal" data-foco><span>Duelo en esta mesa</span><small>dos esgrimistas, un teclado</small></button>
              <button type="button" id="estIrRetos"><span>Desafío en línea</span><small>clava un reto y espera rival</small></button>
              <button type="button" id="estIrEscuela"><span>Escuela de esgrima</span><small>lecciones, maniquí y autómata</small></button>
            </nav>
          </section>

          <!-- Puerta de los retos: el papel va clavado sobre el tablón que dibuja el lienzo -->
          <section class="est-capa est-retos" id="estRetos" aria-label="Desafío en línea">
            <div class="est-tablon" id="estTablon" data-estado="conectando">
              <div class="est-papel">
                <span class="est-clavo est-clavo-a" aria-hidden="true"></span><span class="est-clavo est-clavo-b" aria-hidden="true"></span>
                <h2 class="est-papel-titulo">Retos</h2>
                <p class="est-papel-texto" id="estTablonTexto" role="status"></p>
                <span class="est-vela" aria-hidden="true"></span>
                <div class="est-solo-menu">
                  <button type="button" class="est-accion" id="estCrear" data-foco><span>Clavar un reto nuevo</span></button>
                  <form class="est-responder" id="estUnirForm" autocomplete="off">
                    <label for="estCodigo">Responder al reto</label>
                    <span class="est-codigo-campo"><input id="estCodigo" maxlength="5" placeholder="·····" spellcheck="false" autocapitalize="characters"><button type="submit" class="est-accion est-accion-corta"><span>Acudir</span></button></span>
                  </form>
                </div>
                <div class="est-solo-sala">
                  <p class="est-codigo-grande"><small>Código del reto</small><strong id="estCodigoSala">·····</strong></p>
                  <p class="est-papel-texto" id="estSalaEstado"></p>
                  <button type="button" class="est-accion" id="estListo" data-foco><span>En guardia</span></button>
                  <button type="button" class="est-accion est-accion-sec" id="estSalaSalir"><span>Retirar el reto</span></button>
                </div>
              </div>
            </div>
            <button type="button" class="est-volver" id="estRetosVolver"><span>Volver al claustro</span></button>
          </section>

          <!-- Juicio: el resultado se desenrolla a la derecha; a la izquierda, el vencedor bajo la luz -->
          <section class="est-capa est-juicio" id="estJuicio" aria-label="Resultado">
            <div class="est-pergamino">
              <h2 id="estJuicioTitulo" class="est-juicio-titulo"></h2>
              <p id="estJuicioMotivo" class="est-juicio-motivo"></p>
              <div id="estJuicioFilas" class="est-filas"></div>
              <p id="estJuicioGuardado" class="est-guardado" role="status"></p>
              <div class="est-juicio-botones">
                <button type="button" class="est-accion" id="estRevancha" data-foco><span>Revancha</span></button>
                <button type="button" class="est-accion est-accion-sec" id="estJuicioSalir"><span>Volver al claustro</span></button>
              </div>
            </div>
          </section>

          <!-- Escuela: libro de lecciones a la derecha; se practica a la izquierda -->
          <section class="est-capa est-escuela" id="estEscuela" aria-label="Escuela de esgrima">
            <div class="est-libro">
              <div class="est-libro-pagina">
                <p class="est-libro-num" id="estLeccionNum"></p>
                <h2 class="est-libro-titulo" id="estLeccionTitulo"></h2>
                <div class="est-libro-texto" id="estLeccionTexto"></div>
                <div class="est-libro-pasar">
                  <button type="button" class="est-flecha" id="estLeccionAnt" aria-label="Lección anterior">‹</button>
                  <button type="button" class="est-flecha" id="estLeccionSig" aria-label="Lección siguiente">›</button>
                </div>
              </div>
              <div class="est-libro-opciones">
                <p class="est-opcion-titulo">Rival</p>
                <div class="est-fichas">
                  <button type="button" class="est-ficha" data-rival="maniqui">Maniquí</button>
                  <button type="button" class="est-ficha" data-rival="automata">Autómata</button>
                </div>
                <p class="est-opcion-titulo">El maniquí se cubre</p>
                <div class="est-fichas">
                  <button type="button" class="est-ficha" data-guardia="0">Alto</button>
                  <button type="button" class="est-ficha" data-guardia="1">Medio</button>
                  <button type="button" class="est-ficha" data-guardia="2">Bajo</button>
                  <button type="button" class="est-ficha" data-guardia="-1">Nada</button>
                </div>
              </div>
              <details class="est-libro-teclas">
                <summary>Teclas</summary>
                <div id="estTeclas" class="est-lista-teclas"></div>
                <p class="est-nota">En la mesa de dos, el segundo esgrimista usa flechas, Mayús der., U O, J K L, I y P.</p>
                <button type="button" class="est-enlace" id="estRestablecer">Restablecer</button>
              </details>
              <button type="button" class="est-volver est-volver-libro" id="estEscuelaSalir"><span>Cerrar el libro</span></button>
            </div>
          </section>

          <section class="est-capa est-pausa" id="estPausa" aria-label="Pausa">
            <p class="est-pausa-titulo">Pausa</p>
            <nav class="est-menu est-menu-centro">
              <button type="button" id="estPausaSeguir" data-foco><span>Seguir el duelo</span></button>
              <button type="button" id="estPausaSalir"><span>Volver al claustro</span></button>
            </nav>
          </section>

          <div class="est-banda" id="estBanda" role="status"></div>
        </div>
      </div>

      <div class="est-tactil" id="estTactil" aria-label="Controles táctiles">
        <div class="est-tactil-pad">
          <button type="button" data-a="izq" aria-label="Izquierda">◀</button>
          <button type="button" data-a="der" aria-label="Derecha">▶</button>
          <button type="button" data-a="salto">Salto</button>
          <button type="button" data-a="agachar">Agacha</button>
          <button type="button" data-a="correr" class="ancho">Correr</button>
        </div>
        <div class="est-tactil-pad est-tactil-espada">
          <button type="button" data-a="alt+" aria-label="Subir la espada">▲</button>
          <button type="button" data-a="estocada" class="grande">Estocada</button>
          <button type="button" data-a="alt-" aria-label="Bajar la espada">▼</button>
          <button type="button" data-a="tajo">Tajo</button>
          <button type="button" data-a="finta">Finta</button>
          <button type="button" data-a="guardia">Guardia</button>
          <button type="button" data-a="parada" class="ancho">Parada</button>
        </div>
      </div>
      <p class="est-girar" aria-hidden="true">Gira el teléfono para batirte en horizontal.</p>
    </div>
  </main>

  <script src="js/estocatta-config.js?v=20271271"></script>
  <script src="js/temas.js?v=20271271"></script>
  <script src="js/dialogos.js?v=20271271"></script>
  <script src="js/fichas-supabase.js?v=20271271"></script>
  <script src="js/interruptores.js?v=20271271"></script>
  <script src="js/presencia.js?v=20271271"></script>
  <script src="js/lado.js?v=20271271"></script>
  <script src="servidor/estocatta/estocatta-sim.js?v=20271271"></script>
  <script src="js/estocatta-sprites.js?v=20271271"></script>
  <script src="js/estocatta-mundo.js?v=20271271"></script>
  <script src="js/estocatta-cliente.js?v=20271271"></script>
  <script src="js/avisos-admin.js?v=20271271"></script>
  <script src="js/musica-paginas.js?v=20271271"></script>
</body>
</html>
