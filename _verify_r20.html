<!doctype html><meta charset="utf-8"><title>verify</title>
<body style="background:#5a6b7a;height:100vh;margin:0">
<div id="textchat-input"><textarea></textarea><button class="btn">enviar</button></div>
<script src="js/fichas-roll20.js"></script>
<script>
const h = { nombre: "Disfrazarse", nivel: 1, escuela: "Ilusión", tiempo: "1 acción", alcance: "Personal", duracion: "1 hora", componentes: "V, S", concentracion: false, ritual: false, tipo: "ninguno", dano: "", descripcion: "Haces que tu aspecto cambie hasta que termine el conjuro.\nPuedes parecer 1 pie más alto o más bajo." };
const chat = fichasChatDeHechizo(h, "Nivel 1");
const items = [{ id: "hechizo:1", categoria: "Conjuros", texto: "Disfrazarse (nv. 1)", favorita: true, chat, cmd: { normal: "Disfrazarse", ventaja: "Disfrazarse", desventaja: "Disfrazarse" } }];
window.chatGenerado = chat;
const store = {
  compendio_sesion: JSON.stringify({ email: "x@y.z", access_token: "t", refresh_token: "r", expires_at: 9999999999 }),
  compendio_cache: JSON.stringify([{ id: "p1", nombre: "Prueba", dueno: "", items }]),
  compendio_admin: "false", compendio_confirmar: false
};
window.GM_getValue = (k, d) => (k in store ? store[k] : d);
window.GM_setValue = (k, v) => { store[k] = v; };
window.GM_deleteValue = k => { delete store[k]; };
window.GM_addStyle = css => { const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s); };
window.GM_setClipboard = () => {};
window.GM_xmlhttpRequest = o => { const cuerpo = o.url.includes("fichas_personajes") ? JSON.stringify([{ id: "p1", nombre: "Prueba", dueno: "", roll20: { items } }]) : o.url.includes("es_admin") ? "false" : "0"; setTimeout(() => o.onload({ status: 200, responseText: cuerpo }), 50); };
fetch("roll20/compendio-roll20.user.js").then(r => r.text()).then(t => { (0, eval)(t.replace('location.hostname !== "app.roll20.net"', 'false')); });
</script>
