<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquería — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <script src="js/oculto.js?v=20261098"></script>
  <link rel="stylesheet" href="css/style.css?v=20261098">
  <link rel="stylesheet" href="css/minijuegos.css?v=20261098">
</head>
<body class="mj-pagina">
  <div class="mj-barra">
    <a href="minijuegos.html" class="mj-volver">← Minijuegos</a>
    <div id="globalLadoWidget" class="global-lado-widget">
      <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
      <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
    </div>
  </div>
  <main class="mj-contenido">
    <p class="eyebrow">PASATIEMPOS</p>
    <h1 class="mj-titulo">Arquería</h1>
    <div id="arqueriaRivales" class="aj-rivales"></div>
    <div class="mj-escenario">
      <canvas id="arqueriaCampo" class="mj-campo" role="button" tabindex="0" aria-label="Campo de arquería"></canvas>
      <button type="button" id="arqueriaJugar" class="mj-play" aria-label="Jugar">▶</button>
    </div>
    <p id="arqueriaRecord" class="mj-linea"></p>
  </main>

  <script src="js/temas.js?v=20261098"></script>
  <script src="js/fichas-supabase.js?v=20261098"></script>
  <script src="js/lado.js?v=20261098"></script>
  <script src="js/arqueria.js?v=20261098"></script>
  <script>
    (function () {
      const boton = document.getElementById("arqueriaJugar");
      const recordEl = document.getElementById("arqueriaRecord");
      const rivalesEl = document.getElementById("arqueriaRivales");
      const RIVALES = [
        { id: "cassius", nombre: "Cassius", dificultad: "Fácil" },
        { id: "garra", nombre: "Garra", dificultad: "Media" },
        { id: "verdam", nombre: "Verdam", dificultad: "Difícil" }
      ];
      // El récord de Cassius se guardaba con la clave de antes de que hubiera más rivales
      const clave = id => id === "cassius" ? "compendioArqueriaCassius" : `compendioArqueria_${id}`;
      const leer = id => { try { return parseInt(localStorage.getItem(clave(id)), 10) || 0; } catch (e) { return 0; } };
      let rival = RIVALES[0];
      let jugando = false;

      function pintarRivales() {
        rivalesEl.innerHTML = RIVALES.map(r => `
          <button type="button" class="aj-rival ${r.id === rival.id ? "activo" : ""}" data-rival="${r.id}">
            <strong>${r.nombre}</strong>
            <span>${r.dificultad}</span>
            <small>${leer(r.id) ? `Mejor puntaje: ${leer(r.id)}` : "Sin jugar"}</small>
          </button>`).join("");
      }
      const pintarRecord = () => { recordEl.textContent = leer(rival.id) ? `Tu mejor puntaje contra ${rival.nombre}: ${leer(rival.id)}` : "Clic, o Z / X con el cursor encima."; };
      pintarRivales();
      pintarRecord();

      const juego = crearArqueria({
        canvas: document.getElementById("arqueriaCampo"),
        rival: rival.id,
        duracion: 60,
        onEstado: estado => { jugando = estado === "jugando"; boton.classList.toggle("hidden", jugando); },
        onFin: ({ puntaje }) => {
          if (puntaje > leer(rival.id)) {
            try { localStorage.setItem(clave(rival.id), String(puntaje)); } catch (e) { /* sin almacenamiento */ }
          }
          pintarRivales();
          pintarRecord();
        }
      });
      boton.addEventListener("click", () => juego.iniciar());
      rivalesEl.addEventListener("click", e => {
        const b = e.target.closest("[data-rival]");
        if (!b || jugando) return;
        rival = RIVALES.find(r => r.id === b.dataset.rival);
        juego.cambiarRival(rival.id);
        pintarRivales();
        pintarRecord();
      });
    })();
  </script>
</body>
</html>
