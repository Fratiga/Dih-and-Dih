<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hipódromo en vivo — Compendio del Mundo</title>
  <script src="js/mj-volumen.js?v=20271111"></script>
  <script src="js/dialogos.js?v=20271111"></script>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <link rel="stylesheet" href="css/style.css?v=20271111">
  <link rel="stylesheet" href="css/hipodromo-vivo.css?v=20271202">
</head>
<body class="hv" data-fase="vacio">
  <div class="hv-escena" id="hvEscena">
    <canvas id="hvFondo" class="hv-lienzo"></canvas>
    <div id="hvCapa" class="hv-capa"></div>
    <canvas id="hvFrente" class="hv-lienzo hv-frente"></canvas>
  </div>
  <div class="hv-fundido" id="hvFundido"></div>

  <div class="hv-ui">
    <header class="hv-arriba">
      <a class="hv-boton hv-volver" href="hipodromo.html" title="Volver al hipódromo">← Hipódromo</a>
      <div class="hv-titulo" aria-live="polite">
        <span id="hvNum" class="hv-num">Carrera</span>
        <strong id="hvNombre">Conectando con el hipódromo...</strong>
      </div>
      <div class="hv-reloj">
        <span id="hvFase" class="hv-fase">-</span>
        <span class="hv-cuenta"><i id="hvCuentaTxt">Próxima salida</i><b id="hvCuenta">--:--</b></span>
      </div>
    </header>

    <aside class="hv-datos" id="hvDatos" aria-label="Datos de la carrera"></aside>
    <aside class="hv-puestos" id="hvPuestos" aria-label="Participantes y posiciones">
      <h2 id="hvPuestosTit">Participantes</h2>
      <ol id="hvLista"></ol>
    </aside>

    <div class="hv-mensaje" id="hvMsg" aria-live="assertive"></div>
    <p class="hv-aviso" id="hvAviso" role="status"></p>
    <p class="hv-sonido" id="hvSonido" hidden>Toca la pantalla para activar la música</p>

    <div class="hv-progreso" id="hvProgreso" aria-hidden="true"><div id="hvProgBarra"></div><span>META</span></div>

    <nav class="hv-acciones" aria-label="Acciones">
      <a class="hv-boton" href="hipodromo.html#carrera">Apostar</a>
      <button type="button" class="hv-boton" id="hvVerRes" hidden>Resultado</button>
      <a class="hv-boton" href="hipodromo.html#noticias">Resultados completos</a>
    </nav>

    <section class="hv-resultados" id="hvRes" hidden aria-label="Resultado de la carrera">
      <button type="button" class="hv-cerrar" id="hvResCerrar" aria-label="Cerrar">×</button>
      <h2 id="hvResTit">Resultado</h2>
      <div id="hvResCuerpo"></div>
    </section>

    <div class="hv-local" id="hvLocal" hidden>
      <span>Prueba local (reloj adelantable):</span>
      <button type="button" data-salto="-30">Preparación</button>
      <button type="button" data-salto="0">Salida</button>
      <button type="button" data-salto="25">En carrera</button>
      <button type="button" data-salto="75">Resultados</button>
      <button type="button" data-salto="120">Recuperación</button>
      <button type="button" data-salto="215">Siguiente</button>
      <button type="button" data-salto="3525">+1 h</button>
    </div>
  </div>

  <!-- la hoja de carga: la misma criatura al trote que en hipodromo.html (js/hipodromo-recinto.js, «bicho») -->
  <div class="hv-cargando" id="hvCargando" role="status"><div class="hv-cargando-fig"><svg viewBox="-34 -37 68 41" aria-hidden="true"><path class="hv-pata pb" d="M-6.2 -9.5 V1" stroke="#14241b" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="hv-pata pa" d="M6.4 -9.5 V1" stroke="#14241b" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M-12.5 -16 C-17.5 -16.5 -20.5 -13 -20 -6.5" stroke="#14241b" stroke-width="2.8" stroke-linecap="round" fill="none"/><path fill="#14241b" d="M-13 -13 C-13 -18 -9 -19.6 -4 -19.1 C0 -18.7 3 -18.5 5.6 -19.6 C8.6 -22.2 10.4 -26 11.9 -30.2 L12.5 -33.6 L15.1 -30.9 C18.6 -30 22.2 -26.6 24.8 -23 C25.9 -21.4 24.7 -19.5 22.8 -19.9 C20.6 -20.4 18.9 -22 17 -22.6 C16.7 -19 15.2 -15 13 -12 C12 -8 6 -6.5 0 -6.5 C-6 -6.5 -13 -7.5 -13 -13 Z"/><path class="hv-pata pa" d="M-9.4 -9.5 V1" stroke="#14241b" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="hv-pata pb" d="M9.6 -9.5 V1" stroke="#14241b" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></div><p>Conectando con el hipódromo...</p></div>

  <script src="data/hipodromo-palabras.js?v=20271111"></script>
  <script src="js/hipodromo-nombres.js?v=20271193"></script>
  <script src="js/hipodromo-rasgos.js?v=20271111"></script>
  <script src="js/hipodromo-motor.js?v=20271194"></script>
  <script src="js/hipodromo-dibujo.js?v=20271111"></script>
  <script src="js/hipodromo-pista.js?v=20271111"></script>
  <script src="js/hipodromo-vida.js?v=20271111"></script>
  <script src="js/fichas-supabase.js?v=20271111"></script>
  <script src="js/hipodromo-online.js?v=20271111"></script>
  <script src="js/hipodromo-vivo.js?v=20271111"></script>
  <script src="js/interruptores.js?v=20271111"></script>
  <script src="js/avisos-admin.js?v=20271111"></script>
  <script src="js/musica-paginas.js?v=20271111"></script>
</body>
</html>
