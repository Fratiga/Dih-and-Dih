<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duelo — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <script src="js/oculto.js?v=20261218"></script>
  <link rel="stylesheet" href="css/style.css?v=20261220">
  <link rel="stylesheet" href="css/minijuegos.css?v=20261220">
  <link rel="stylesheet" href="css/mj-temas.css?v=20261221">
  <script src="js/mj-volumen.js?v=20261220"></script>
</head>
<body class="mj-pagina duelo-tema">
  <!-- Página aparte a propósito: sin cabecera del sitio, sin mini reproductor ni escenas 3D. -->
  <div class="mj-barra">
    <a href="minijuegos.html" class="mj-volver">← Minijuegos</a>
    <div id="globalLadoWidget" class="global-lado-widget">
      <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
      <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
    </div>
  </div>
  <main class="mj-contenido duelo-contenido">
    <p class="eyebrow">PASATIEMPOS</p>
    <h1 class="mj-titulo">Duelo</h1>

    <div class="duelo-escenario">
      <canvas id="dueloCampo" class="duelo-campo" aria-label="Duelo"></canvas>

      <div id="dueloMenu" class="duelo-capa">
        <h2>Elige a tu rival</h2>
        <div id="dueloRivales" class="duelo-rivales"></div>
        <p class="duelo-ayuda">Atacar con Z (mantén para un golpe pesado) · Bloquear con X (mantén; justo antes del golpe es una parada) · Esquivar con C o Espacio.</p>
      </div>

      <div id="dueloFin" class="duelo-capa hidden">
        <h2 id="dueloFinTitulo"></h2>
        <p id="dueloFinTexto"></p>
        <div class="duelo-fin-botones">
          <button type="button" id="dueloReintentar" class="duelo-boton">Otra vez</button>
          <button type="button" id="dueloMenuBtn" class="duelo-boton">Elegir rival</button>
        </div>
      </div>
    </div>

    <div class="duelo-controles">
      <button type="button" id="dueloBtnAtacar" class="duelo-control">Atacar<small>Z</small></button>
      <button type="button" id="dueloBtnBloquear" class="duelo-control">Bloquear<small>X</small></button>
      <button type="button" id="dueloBtnEsquivar" class="duelo-control">Esquivar<small>C</small></button>
    </div>

    <h2 class="mj-subtitulo">Ranking</h2>
    <p class="mj-nota">Se anotan las partidas de quienes tienen sesión iniciada.</p>
    <div id="dueloRankings" class="sacrificio-rankings"></div>
  </main>
  <script src="js/temas.js?v=20261218"></script>
  <script src="js/dialogos.js?v=20261218"></script>
  <script src="js/fichas-supabase.js?v=20261218"></script>
  <script src="js/presencia.js?v=20261218"></script>
  <script src="js/lado.js?v=20261218"></script>
  <script src="js/minijuegos-stats.js?v=20261218"></script>
  <script src="js/duelo.js?v=20261220"></script>
</body>
</html>
