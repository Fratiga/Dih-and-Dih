];
window.llamadas = [];
async function fichasCliente(){ return { rpc: async (n, a) => { window.llamadas.push([n, a]);

  return { data: null, error: { message: "rpc desconocida " + n } }; } }; }
async function adminListarPerfiles(){ return [{id:"u", username:"Aguila"}]; }
</script>
