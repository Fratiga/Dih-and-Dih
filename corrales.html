  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

</head>
<body class="lb co">
  <script src="js/carga.js?v=20270353"></script>
  <div class="lb-fondo" aria-hidden="true"></div>

  <div class="lb-pagina co-pagina">
    <header class="lb-cab">
      <div class="lb-cab-titulo">
        <p class="lb-eyebrow">★ EL PATIO ★</p>
        <h1>Corrales</h1>
        <p class="lb-sub">Elige un hábitat y cría a tu pareja.</p>
      </div>
      <div class="lb-cab-widgets">
        <a class="lb-boton" href="index.html">← A la taberna</a>
        <a class="lb-boton" href="habitacion.html">Mi habitación</a>
        <a class="lb-boton" href="cartas.html">Álbum</a>
        <div id="globalLadoWidget" class="global-lado-widget">
          <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
          <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
        </div>
        <div id="temaWidget" class="tema-widget">
          <button id="temaBadge" class="tema-badge" type="button" title="Cambiar tema">Tema</button>
          <div id="temaPopover" class="tema-popover hidden"></div>
        </div>
      </div>
    </header>

    <p id="coAviso" class="hb-aviso hidden" role="status"></p>

    <div class="co-cuerpo" id="coCuerpo">
      <!-- Los seis hábitats: el elegido se ve grande debajo -->
      <nav class="co-tabs" id="coFranja" role="tablist" aria-label="Hábitats"></nav>

      <!-- El corral activo: solo arte, sin texto encima -->
      <section class="co-vista" aria-live="polite">
        <svg class="co-escena" id="coEscena" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img" aria-label="Hábitat elegido"></svg>
      </section>

      <!-- La ficha del corral: nombre, estado y reloj, fuera del dibujo -->
      <section class="co-barra" id="coBarra"></section>

      <!-- Lo que se puede hacer ahora en este corral -->
      <section class="co-panel" id="coPanel"></section>

      <p class="co-historial" id="coHistorial"></p>
    </div>
  </div>

  <script src="data/personajes.js?v=20270353"></script>
