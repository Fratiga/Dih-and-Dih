<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdam — Muerte Súbita</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <link rel="stylesheet" href="css/encuentro.css?v=20270105">
</head>
<body class="enc-pagina">
  <!-- Página aparte del combate: no carga el resto del sitio. Se llega aquí
       desde Muerte Súbita, con un intento ya abierto (?i=...). -->
  <canvas id="encCenizas" class="enc-cenizas" aria-hidden="true"></canvas>

  <div id="encIntro" class="enc-intro">
    <p class="enc-intro-sub">Un cazador te espera</p>
    <h1 class="enc-intro-nombre">VERDAM</h1>
    <p class="enc-intro-epiteto">El que nunca falla</p>
  </div>

  <div id="encVolumen" class="ms-volumen enc-volumen"></div>

  <main class="enc-contenido">
    <p class="enc-apuesta" id="encApuesta"></p>

    <div class="enc-arena" id="encArena">
      <div class="enc-boss" aria-hidden="true"></div>

      <canvas id="encCampo" class="enc-campo" role="button" tabindex="0" aria-label="Combate"></canvas>
      <button type="button" id="encJugar" class="enc-boton hidden">Enfrentar</button>

      <div id="encVeredicto" class="enc-veredicto hidden">
        <h2 id="encVeredictoTitulo"></h2>
        <p id="encVeredictoTexto"></p>
        <a href="muerte-subita.html" class="enc-volver">Volver al Dominio</a>
      </div>
    </div>

    <div class="enc-barra-boss">
      <span class="enc-barra-nombre">Verdam</span>
      <div class="enc-barra"><div id="encBarra" class="enc-barra-relleno"></div></div>
    </div>
    <p id="encAviso" class="enc-aviso"></p>
  </main>

  <script src="js/ms-musica.js?v=20270105"></script>
  <script src="js/dialogos.js?v=20270105"></script>
  <script src="js/fichas-supabase.js?v=20270105"></script>
  <script src="js/muerte-subita-supabase.js?v=20270105"></script>
  <script src="js/arqueria.js?v=20270105"></script>
  <script src="js/encuentro-verdam.js?v=20270105"></script>
