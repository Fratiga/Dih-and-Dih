<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacrificar a Hooey — Compendio del Mundo</title>
  <link rel="icon" type="image/png" href="assets/cosas/gorro-bufon.png">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261142">
  <link rel="stylesheet" href="css/mj-temas.css?v=20261142">
  <script src="js/mj-volumen.js?v=20261142"></script>
</head>
<body class="sacrificio-pagina hooey-tema">
  <!-- Página aparte, a propósito: sin cabecera, marquesinas, mini reproductor
       ni escena 3D del header, para que el juego tenga todo el rendimiento. -->
  <div class="sacrificio-barra">
    <a href="index.html" class="sacrificio-volver">← Volver al inicio</a>
    <div id="globalLadoWidget" class="global-lado-widget">
      <button id="globalLadoBadge" class="global-lado-badge" type="button">Iniciar sesión</button>
      <div id="globalLadoPopover" class="global-lado-popover hidden"></div>
    </div>
  </div>

  <main class="sacrificio-contenido">
    <div class="content-top">
      <div>
        <p class="eyebrow">PASATIEMPOS</p>
        <h1 class="sacrificio-titulo">Sacrificar a Hooey</h1>
      </div>
    </div>

    <div class="sacrificio-medidor">
      <span class="sacrificio-medidor-etiqueta">Hooeys sacrificados en total</span>
      <strong id="sacrificioMedidor">—</strong>
    </div>

    <div class="sacrificio-fila">
    <div class="sacrificio-banner" aria-hidden="true"></div>
    <div class="sacrificio-escenario">
      <canvas id="sacrificioCampo" class="sacrificio-campo" role="button" tabindex="0" aria-label="Sacrificar a Hooey"></canvas>
      <canvas id="sacrificioFuego" class="sacrificio-fuego" width="384" height="216" aria-hidden="true"></canvas>
      <button type="button" id="sacrificioJugar" class="sacrificio-play" aria-label="Jugar">▶</button>
    </div>
    <div class="sacrificio-banner sacrificio-banner-der" aria-hidden="true"></div>
    </div>
    <p id="sacrificioEstado" class="sacrificio-contador"></p>
    <p id="sacrificioCuenta" class="sacrificio-ayuda"></p>
    <p class="sacrificio-ayuda sacrificio-controles">Clic, o Z / X con el cursor encima.</p>
    <label class="sacrificio-ayuda sacrificio-cancion">Música
      <select id="sacrificioCancion">
        <option value="mata">Air Waves</option>
        <option value="badapple">Bad Apple!!</option>
      </select>
    </label>

    <div class="sacrificio-rankings">
      <div class="sacrificio-ranking">
        <h3>Más Hooeys sacrificados</h3>
        <ol id="sacrificioRankTotal" class="sacrificio-lista"></ol>
      </div>
      <div class="sacrificio-ranking">
        <h3>Mejor racha sin tocar el piso</h3>
        <ol id="sacrificioRankRacha" class="sacrificio-lista"></ol>
      </div>
    </div>
  </main>

  <div id="sacrificioBufones" class="sacrificio-bufones"></div>

  <script src="js/temas.js?v=20261142"></script>
  <script src="js/fichas-supabase.js?v=20261142"></script>
  <script src="js/lado.js?v=20261142"></script>
  <script src="js/sacrificio-bufones.js?v=20261142"></script>
  <script src="js/sacrificio.js?v=20261142"></script>
</body>
</html>
